<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>قرآن کریم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f3f7f4;
    color:#173c2c;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    direction:rtl;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    background:#0b4b35;
    color:white;

    padding:
        14px
        14px
        12px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.12);

    position:relative;
    z-index:100;
}


/* =========================================================
   SURAH SEARCH
========================================================= */

.surah-search{
    position:relative;
}

.surah-search-input{
    width:100%;

    border:none;
    outline:none;

    background:white;
    color:#173c2c;

    border-radius:13px;

    padding:
        12px
        42px
        12px
        12px;

    font-size:14px;
    font-weight:bold;

    direction:rtl;
}

.surah-search-input::placeholder{
    color:#91a29a;
}

.search-icon{
    position:absolute;

    right:13px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    color:#176c49;

    pointer-events:none;
}


/* =========================================================
   SURAH WEB LIST
========================================================= */

.surah-list{
    margin-top:8px;

    background:white;

    border-radius:14px;

    overflow:hidden;

    max-height:245px;

    overflow-y:auto;

    box-shadow:
        0 4px 14px rgba(0,0,0,.12);

    scrollbar-width:thin;
}

.surah-item{
    width:100%;

    display:flex;

    flex-direction:row;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    border:none;

    border-bottom:
        1px solid
        #edf2ef;

    background:white;

    color:#173c2c;

    padding:
        11px
        12px;

    text-align:right;

    transition:
        background .15s,
        transform .1s;
}

.surah-item:last-child{
    border-bottom:none;
}

.surah-item:hover{
    background:#f2f8f4;
}

.surah-item:active{
    transform:scale(.995);
}

.surah-item.active{
    background:#eaf6ef;
}

.surah-item-name{
    flex:1;

    text-align:right;

    font-size:14px;

    font-weight:bold;

    color:#173c2c;
}

.surah-item.active
.surah-item-name{
    color:#0b4b35;
}

.surah-item-number{
    min-width:35px;

    height:32px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:9px;

    background:#edf7f1;

    color:#176c49;

    font-size:12px;

    font-weight:bold;
}

.surah-item.active
.surah-item-number{
    background:#176c49;
    color:white;
}

.surah-empty{
    padding:16px;

    text-align:center;

    color:#81938b;

    font-size:13px;
}


/* =========================================================
   AYAH / PAGE JUMP
========================================================= */

.ayah-jump{
    background:white;

    margin:
        12px;

    padding:14px;

    border-radius:16px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.ayah-jump-title{
    color:#0b4b35;

    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;

    text-align:right;
}

.ayah-jump-row{
    display:flex;

    gap:8px;

    align-items:center;
}

.ayah-number-input{
    flex:1;

    min-width:0;

    border:
        1px solid
        #d6e3dc;

    outline:none;

    background:#f8fbf9;

    color:#173c2c;

    border-radius:11px;

    padding:
        11px
        12px;

    font-size:16px;

    font-weight:bold;

    text-align:center;

    direction:ltr;

    transition:
        border .2s,
        background .2s;
}

.ayah-number-input:focus{
    border-color:#27845a;

    background:white;
}

.go-ayah{
    border:none;

    border-radius:11px;

    background:#176c49;

    color:white;

    padding:
        11px
        15px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    box-shadow:
        0 3px 8px rgba(23,108,73,.18);
}

.go-ayah:active{
    transform:scale(.98);
}


/* =========================================================
   PAGE JUMP
========================================================= */

.page-jump-row{
    display:flex;

    gap:8px;

    align-items:center;

    margin-top:9px;
}

.page-number-input{
    flex:1;

    min-width:0;

    border:
        1px solid
        #d6e3dc;

    outline:none;

    background:#f8fbf9;

    color:#173c2c;

    border-radius:11px;

    padding:
        11px
        12px;

    font-size:16px;

    font-weight:bold;

    text-align:center;

    direction:ltr;

    transition:
        border .2s,
        background .2s;
}

.page-number-input:focus{
    border-color:#27845a;

    background:white;
}

.go-page{
    border:none;

    border-radius:11px;

    background:#0b4b35;

    color:white;

    padding:
        11px
        15px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    box-shadow:
        0 3px 8px rgba(11,75,53,.18);
}

.go-page:active{
    transform:scale(.98);
}

.ayah-jump-hint{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:8px;

    color:#71877d;

    font-size:12px;
}

.page-badge{
    background:#edf7f1;

    color:#176c49;

    border-radius:8px;

    padding:
        5px
        8px;

    font-weight:bold;

    white-space:nowrap;
}

.jump-error{
    color:#b34b4b;

    font-size:12px;

    margin-top:7px;

    min-height:18px;
}


/* =========================================================
   SURAH INFO
========================================================= */

.surah-info{
    background:white;

    margin:12px;

    padding:14px;

    border-radius:16px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    text-align:center;
}


/* =========================================================
   SURAH NAVIGATION
========================================================= */

.surah-nav{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-bottom:6px;
}

.surah-nav-btn{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border:none;

    border-radius:12px;

    background:#edf7f1;

    color:#176c49;

    font-size:25px;

    font-weight:bold;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:
        transform .15s,
        background .15s;
}

.surah-nav-btn:active{
    transform:scale(.92);
}

.surah-nav-btn:disabled{
    opacity:.35;
    cursor:default;
}

.surah-title-wrap{
    flex:1;

    min-width:0;

    text-align:center;
}

.surah-name{
    color:#0b4b35;

    font-size:21px;

    font-weight:bold;

    margin-bottom:5px;
}

.surah-neighbors{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    color:#81938b;

    font-size:10px;

    line-height:1.5;

    min-height:18px;
}

.surah-neighbor{
    flex:1;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.surah-neighbor.prev{
    text-align:right;
}

.surah-neighbor.next{
    text-align:left;
}

.surah-meta{
    color:#648073;

    font-size:13px;

    margin-top:5px;
}

.surah-page{
    display:inline-block;

    margin-top:8px;

    background:#edf7f1;

    color:#176c49;

    padding:
        5px
        10px;

    border-radius:9px;

    font-size:12px;

    font-weight:bold;
}


/* =========================================================
   MODES
========================================================= */

.modes{
    display:flex;

    gap:8px;

    margin:
        0
        12px
        12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.modes::-webkit-scrollbar{
    display:none;
}

.mode{
    flex:1;

    min-width:115px;

    border:
        1px solid
        #cfe0d7;

    background:white;

    color:#176c49;

    border-radius:12px;

    padding:
        10px
        8px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.mode.active{
    background:#176c49;

    color:white;

    border-color:#176c49;

    box-shadow:
        0 3px 8px rgba(23,108,73,.2);
}


/* =========================================================
   STICKY PLAYER
========================================================= */

.player-sticky{
    position:sticky;

    top:0;

    z-index:90;

    padding:
        0
        12px
        8px;

    background:
        linear-gradient(
            to bottom,
            #f3f7f4 0%,
            #f3f7f4 82%,
            rgba(243,247,244,0) 100%
        );
}


/* =========================================================
   PLAYER
========================================================= */

.player{
    background:white;

    padding:13px;

    border-radius:18px;

    box-shadow:
        0 4px 16px rgba(0,0,0,.13);
}

.player-status{
    text-align:center;

    font-size:13px;

    color:#547265;

    margin-bottom:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   START SURAH
========================================================= */

.start-surah{
    width:100%;

    border:none;

    border-radius:12px;

    background:#f39c12;

    color:white;

    padding:
        9px
        12px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:10px;

    transition:
        transform .15s,
        background .15s;
}

.start-surah:active{
    transform:scale(.99);
}

.start-surah.playing{
    background:#e67e22;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{
    width:100%;

    height:7px;

    background:#e2ebe6;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.progress{
    width:0%;

    height:100%;

    background:#176c49;

    transition:
        width .1s linear;
}

.time-row{
    display:flex;

    justify-content:space-between;

    direction:ltr;

    margin-top:5px;

    color:#6d8077;

    font-size:11px;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:18px;

    margin-top:10px;

    direction:rtl;
}

.control-box{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    min-width:62px;
}

.control{
    width:48px;
    height:48px;

    border:none;

    border-radius:50%;

    background:#e9f2ed;

    color:#176c49;

    font-size:23px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);

    transition:
        transform .15s,
        background .15s;
}

.control:active{
    transform:scale(.92);
}

.control.play{
    width:60px;
    height:60px;

    background:#176c49;

    color:white;

    font-size:27px;
}

.control-label{
    margin-top:4px;

    font-size:10px;

    color:#668277;

    white-space:nowrap;

    line-height:1.2;
}


/* =========================================================
   AYAH CONTAINER
========================================================= */

.ayah-container{
    padding:
        0
        12px
        30px;
}


/* =========================================================
   BISMILLAH
========================================================= */

.bismillah{
    text-align:center;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2;

    font-weight:700;

    color:#0b4b35;

    margin:
        4px
        0
        18px;

    padding:
        4px
        8px
        14px;

    border-bottom:
        1px solid
        #dfe8e2;
}


/* =========================================================
   AYAH
========================================================= */

.ayah{
    background:white;

    border-radius:18px;

    margin-bottom:12px;

    padding:16px;

    border:
        1px solid
        #e4ece7;

    box-shadow:
        0 2px 9px rgba(0,0,0,.045);

    cursor:pointer;

    transition:
        background .2s,
        border .2s,
        transform .15s;
}

.ayah:active{
    transform:scale(.995);
}

.ayah.active{
    background:#edf7f1;

    border:
        2px solid
        #27845a;

    box-shadow:
        0 4px 15px rgba(23,108,73,.12);
}


/* =========================================================
   ARABIC
========================================================= */

.arabic{
    direction:rtl;

    text-align:right;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2.25;

    font-weight:700;

    color:#173c2c;
}

.ayah-number{
    display:inline-flex;

    justify-content:center;

    align-items:center;

    width:30px;
    height:30px;

    margin-left:8px;

    border-radius:50%;

    background:#176c49;

    color:white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:12px;

    vertical-align:middle;
}


/* =========================================================
   TRANSLATION
========================================================= */

.translation{
    margin-top:13px;

    padding-top:12px;

    border-top:
        1px solid
        #edf1ee;

    color:#45675a;

    font-size:16px;

    line-height:2;

    font-weight:bold;

    text-align:right;
}

.translation-empty{
    color:#94a69e;

    font-size:13px;

    font-weight:normal;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    text-align:center;

    margin:
        10px
        12px
        28px;

    padding:
        18px
        12px;

    color:#648073;

    font-size:12px;

    line-height:2;

    border-top:
        1px solid
        #dfe8e2;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    text-align:center;

    padding:35px 15px;

    color:#668276;

    font-size:15px;
}

.error{
    margin:20px 12px;

    padding:16px;

    background:#fff0f0;

    color:#a33;

    border-radius:12px;

    text-align:center;

    line-height:1.9;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .surah-list{
        max-height:220px;
    }

    .surah-item{
        padding:
            10px
            11px;
    }

    .surah-item-name{
        font-size:13px;
    }

    .ayah-jump-row{
        gap:6px;
    }

    .page-jump-row{
        gap:6px;
    }

    .go-ayah,
    .go-page{
        padding-left:12px;
        padding-right:12px;
    }

    .arabic{
        font-size:24px;
        line-height:2.2;
    }

    .translation{
        font-size:15px;
    }

    .controls{
        gap:13px;
    }

    .control{
        width:46px;
        height:46px;
        font-size:22px;
    }

    .control.play{
        width:58px;
        height:58px;
    }

    .control-box{
        min-width:56px;
    }

    .bismillah{
        font-size:23px;
    }

    .surah-nav-btn{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

}


/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */

@media(max-width:600px) and (max-height:700px){

    .player{
        padding:9px 11px;
    }

    .player-status{
        margin-bottom:6px;
    }

    .start-surah{
        padding:7px 10px;
        margin-bottom:7px;
    }

    .controls{
        margin-top:7px;
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto !important;
        transition:none !important;
    }

}

</style>
</head>

<body>

<div class="app">


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="surah-search">

        <span class="search-icon">
            🔎
        </span>

        <input
            id="surahSearch"
            class="surah-search-input"
            type="search"
            autocomplete="off"
            placeholder="جستجوی نام سوره..."
        >

    </div>


    <div
        id="surahList"
        class="surah-list"
    >

        <div class="surah-empty">
            در حال دریافت سوره‌ها...
        </div>

    </div>

</header>


<!-- =====================================================
     AYAH / PAGE JUMP
====================================================== -->

<section class="ayah-jump">

    <div class="ayah-jump-title">
        🎯 رفتن مستقیم
    </div>


    <div class="ayah-jump-row">

        <input
            id="ayahNumberInput"
            class="ayah-number-input"
            type="number"
            inputmode="numeric"
            min="1"
            placeholder="شماره آیه"
        >

        <button
            id="goAyah"
            class="go-ayah"
            type="button"
        >
            ▶ رفتن به آیه
        </button>

    </div>


    <div class="page-jump-row">

        <input
            id="pageNumberInput"
            class="page-number-input"
            type="number"
            inputmode="numeric"
            min="1"
            max="604"
            placeholder="شماره صفحه عثمان طه"
        >

        <button
            id="goPage"
            class="go-page"
            type="button"
        >
            📄 رفتن به صفحه
        </button>

    </div>


    <div class="ayah-jump-hint">

        <span id="ayahCountHint">
            ابتدا یک سوره انتخاب کنید.
        </span>

        <span
            id="jumpPageBadge"
            class="page-badge"
            style="display:none;"
        >
            صفحه —
        </span>

    </div>


    <div
        id="jumpError"
        class="jump-error"
    ></div>

</section>


<!-- =====================================================
     SURAH INFO
====================================================== -->

<section class="surah-info">

    <div class="surah-nav">

        <button
            id="prevSurah"
            class="surah-nav-btn"
            type="button"
            title="سوره قبل"
            aria-label="سوره قبل"
        >
            →
        </button>


        <div class="surah-title-wrap">

            <div
                class="surah-name"
                id="surahName"
            >
                قرآن کریم
            </div>


            <div class="surah-neighbors">

                <span
                    id="prevSurahName"
                    class="surah-neighbor prev"
                >
                    سوره قبل
                </span>

                <span
                    id="nextSurahName"
                    class="surah-neighbor next"
                >
                    سوره بعد
                </span>

            </div>

        </div>


        <button
            id="nextSurah"
            class="surah-nav-btn"
            type="button"
            title="سوره بعد"
            aria-label="سوره بعد"
        >
            ←
        </button>

    </div>


    <div
        class="surah-meta"
        id="surahInfo"
    >
        در حال آماده‌سازی...
    </div>


    <div
        id="surahPage"
        class="surah-page"
        style="display:none;"
    >
        📄 صفحه —
    </div>

</section>


<!-- =====================================================
     MODES
====================================================== -->

<div class="modes">

    <button
        class="mode active"
        data-mode="arabic"
    >
        🔊 فقط قرائت
    </button>

    <button
        class="mode"
        data-mode="translation"
    >
        🇮🇷 فقط ترجمه
    </button>

    <button
        class="mode"
        data-mode="both"
    >
        🔊🇮🇷 قرائت + ترجمه
    </button>

</div>


<!-- =====================================================
     STICKY PLAYER
====================================================== -->

<div class="player-sticky">

    <section class="player">

        <div
            class="player-status"
            id="playerStatus"
        >
            آماده پخش
        </div>


        <button
            class="start-surah"
            id="startSurah"
            type="button"
        >
            ▶ شروع سوره
        </button>


        <div
            class="progress-wrap"
            id="progressWrap"
        >

            <div
                class="progress"
                id="progress"
            ></div>

        </div>


        <div class="time-row">

            <span id="duration">
                0:00
            </span>

            <span id="currentTime">
                0:00
            </span>

        </div>


        <div class="controls">


            <div class="control-box">

                <button
                    class="control"
                    id="prev"
                    title="آیه قبلی"
                    aria-label="آیه قبلی"
                >
                    →
                </button>

                <div class="control-label">
                    آیه قبلی
                </div>

            </div>


            <div class="control-box">

                <button
                    class="control play"
                    id="play"
                    title="پخش"
                    aria-label="پخش"
                >
                    ▶
                </button>

                <div class="control-label">
                    پخش
                </div>

            </div>


            <div class="control-box">

                <button
                    class="control"
                    id="next"

/* =========================================================
   PERSIAN NUMBERS
========================================================= */

function faNumber(value){

    return String(value)
        .replace(
            /\d/g,
            d =>
                "۰۱۲۳۴۵۶۷۸۹"[
                    Number(d)
                ]
        );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");

    return `${minutes}:${secs}`;

}


/* =========================================================
   SURAH NAME
========================================================= */

function getSurahName(surah){

    if(
        surah &&
        surah.name_fa
    ){

        return surah.name_fa;

    }

    if(
        surah &&
        surah.name_ar
    ){

        return surah.name_ar;

    }

    if(
        surah &&
        surah.name
    ){

        return surah.name;

    }

    if(
        surah &&
        surah.number
    ){

        return (
            `سوره ${faNumber(
                surah.number
            )}`
        );

    }

    return "سوره";

}


/* =========================================================
   NORMALIZE SEARCH
========================================================= */

function normalizeSearchText(text){

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/أ/g,"ا")
        .replace(/إ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(
            /َ|ً|ُ|ٌ|ِ|ٍ|ْ|ّ|ـ/g,
            ""
        );

}


/* =========================================================
   AUDIO URL
========================================================= */

function getBismillahAudioUrl(){

        "001/001001.mp3"
    );

}


function getAudioUrl(
    surahId,
    ayahNumber
){

    const surah =
        String(surahId)
        .padStart(3,"0");

    const fileNumber =
        Number(ayahNumber);

    const ayah =
        String(fileNumber)
        .padStart(3,"0");

    return (
        SUPABASE_BASE +
        `${surah}/${surah}${ayah}.mp3`
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function clearNextAudio(){

    if(nextAudio){

        try{

        }

        nextAudio.load();

    }

}


function preloadNextAyah(){

    if(!ayahData.length){
        return;
    }


    let nextAyah =
        Number(currentAyah) + 1;


    if(
        isBismillahAudio
    ){

        nextAyah = 1;

    }

    }


    nextAudioUrl =

            nextAyah

    nextAudio =
        new Audio();

    nextAudio.preload =
        "auto";

    nextAudio.src =

}


/* =========================================================
   LOAD SURAHS
========================================================= */

async function loadSurahs(){

    try{

        surahList.innerHTML =
            `
            <div class="surah-empty">
                در حال دریافت سوره‌ها...
            </div>
            `;


        const response =
            await fetch(
                `${WORKER_URL}/surahs`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const result =
            await response.json();


        if(
            !result.ok ||
            !Array.isArray(
                result.surahs
            )
        ){

            throw new Error(
                "اطلاعات سوره‌ها از Worker دریافت نشد."
            );

        }


        surahData =
            result.surahs;


        renderSurahList();


        await loadAyahs();

    }
    catch(error){

function renderSurahList(

){

        surahData.filter(
            surah => {

                if(!normalized){

                    return true;

                }


                const number =
                    String(
                        surah.number
                    );

                const nameFa =
                    normalizeSearchText(
                        surah.name_fa
                    );

                const nameAr =
                    normalizeSearchText(
                        surah.name_ar
                    );

                const nameEn =
                    normalizeSearchText(
                        surah.name_en
                    );


                return (
                    number.includes(
                        normalized
                    ) ||
                    nameFa.includes(
                        normalized
                    ) ||
                    nameAr.includes(
                        normalized
                    ) ||
                    nameEn.includes(
                        normalized
                    )
                );

            }
        );


    surahList.innerHTML = "";


    if(!filtered.length){

        surahList.innerHTML =
            `
            <div class="surah-empty">
                سوره‌ای پیدا نشد.

        return;

    }


    filtered.forEach(

/* =========================================================
   SELECT SURAH
========================================================= */

async function selectSurah(
    value
){

    if(
        !value ||
        value < 1 ||
        value > 114
    ){

        return;

    }


    if(
        Number(value) ===
        Number(currentSurah) &&
        ayahData.length
    ){

        renderSurahList(
            surahSearch.value
        );

        updateSurahNavigation();

        return;

    }


    pauseAudio();


    audio.removeAttribute(
        "src"
    );

    audio.load();


    clearNextAudio();


    isBismillahAudio =
        false;

    bismillahPlayedForCurrentAyah =
        false;


    startSurahButton.classList.remove(
        "playing"
    );


    progress.style.width =
        "0%";

    currentTimeElement.textContent =
        "0:00";

    durationElement.textContent =
        "0:00";


    currentSurah =
        value;

    currentAyah =
        1;


    clearJumpError();


    surahSearch.value =
        "";


    renderSurahList();


    await loadAyahs();

}


/* =========================================================
   LOAD SURAH + SPECIFIC AYAH
========================================================= */

async function loadSurahAndAyah(
    surahNumber,
    ayahNumber = 1,
    autoPlay = false
){

    if(
        surahNumber < 1 ||
        surahNumber > 114
    ){

        return false;

    }


    pauseAudio();


    clearNextAudio();


    audio.removeAttribute(
        "src"
    );

    audio.load();


    currentSurah =
        Number(surahNumber);


    currentAyah =
        1;


    isBismillahAudio =
        false;


    bismillahPlayedForCurrentAyah =
        false;


    renderSurahList();


    await loadAyahs();


    if(
        !ayahData.length
    ){

        return false;

    }


    const target =
        ayahData.find(
            item =>
                Number(
                    item.ayah_number
                ) ===
                Number(ayahNumber)
        );


    if(!target){

        currentAyah =
            1;

    }
    else{

        currentAyah =
            Number(
                target.ayah_number
            );

    }


    if(
        currentAyah === 1 &&
        Number(currentSurah) !== 1 &&
        Number(currentSurah) !== 9
    ){

        bismillahPlayedForCurrentAyah =
            false;

    }
    else{

        bismillahPlayedForCurrentAyah =
            true;

    }


    isBismillahAudio =
        false;


    ayahNumberInput.value =
        currentAyah;


    if(target){

        showJumpPage(
            target.page
        );

    }
    else{

        hideJumpPage();

    }


    renderAyahs();

    updateSurahInfo();

    updateSurahNavigation();

    loadAyah();


    if(autoPlay){

        await playAudio();

    }


    return true;

}

            `;

    finally{

        isLoading = false;

    }

}


/* =========================================================
   EXTRACT BISMILLAH
========================================================= */

function extractBismillah(text){

    if(!text){

        return {
            bismillah:"",
            remaining:""
        };

    }


    const normalized =
        text
            .normalize("NFC")
            .trim();


    const patterns = [

        /^بِسْمِ\s+ٱللَّهِ\s+ٱلرَّحْمَٰنِ\s+ٱلرَّحِيمِ/,

        /^بِسْمِ\s+اللَّهِ\s+الرَّحْمَٰنِ\s+الرَّحِيمِ/,

        /^بِسْمِ\s+اللَّهِ\s+الرَّحْمَٰنِ\s+الرَّحِيمِ/,

        /^بِسْمِ\s+ٱللَّهِ\s+ٱلرَّحْمَٰنِ\s+ٱلرَّحِيمِ/

    ];


    for(
        const pattern of patterns
    ){

        const match =
            normalized.match(
                pattern
            );


        if(match){

            const bismillah =
                match[0].trim();


            const remaining =
                normalized
                    .slice(
                        match[0].length
                    )
                    .trim();


            return {
                bismillah,
                remaining
            };

        }

    }


    return {
        bismillah:"",
        remaining:normalized
    };

}


/* =========================================================
   RENDER AYAHS
========================================================= */

function renderAyahs(){

    ayahContainer.innerHTML = "";


    ayahData.forEach(
        ayah => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ayah";


            div.id =
                `ayah-${ayah.ayah_number}`;


            div.dataset.ayah =
                ayah.ayah_number;


            let arabicText =
                ayah.text_ar || "";


            let bismillah = "";


            /*
                حمد:
                بسم‌الله خودش آیه اول است.

                توبه:
                بسم‌الله ندارد.

                سایر سوره‌ها:
                فقط خود بسم‌الله جدا می‌شود.

                بنابراین در سوره بقره:
                «الم» داخل متن آیه اول باقی می‌ماند
                و هرگز داخل کادر بسم‌الله قرار نمی‌گیرد.
            */

            if(
                Number(currentSurah) !== 1 &&
                Number(currentSurah) !== 9 &&
                Number(ayah.ayah_number) === 1
            ){

                const extracted =
                    extractBismillah(
                        arabicText
                    );


                bismillah =
                    extracted.bismillah;


                arabicText =
                    extracted.remaining;

            }


            const translation =
                ayah.text_fa &&
                ayah.text_fa.trim()
                    ? ayah.text_fa
                    : "";


            let html = "";


            if(bismillah){

                html +=
                    `
                    <div class="bismillah">
                        ${bismillah}
                    </div>
                    `;

            }


            html +=
                `
                <div class="arabic">

                    <span class="ayah-number">
                        ${faNumber(
                            ayah.ayah_number
                        )}
                    </span>

                    ${arabicText}

                </div>

                <div class="translation">

                    ${
                        translation
                            ? translation
                            :
                            `
                            <span class="translation-empty">
                                ترجمه فارسی در مرحله بعد اضافه می‌شود.
                            </span>
                            `
                    }

                </div>
                `;


            div.innerHTML =
                html;


            div.addEventListener(
                "click",
                () => {

                    currentAyah =
                        Number(
                            ayah.ayah_number
                        );


                    if(
                        currentAyah === 1 &&
                        Number(currentSurah) !== 1 &&
                        Number(currentSurah) !== 9
                    ){

                        bismillahPlayedForCurrentAyah =
                            false;

                    }
                    else{

                        bismillahPlayedForCurrentAyah =
                            true;

                    }


                    isBismillahAudio =
                        false;


                    ayahNumberInput.value =
                        currentAyah;


                    showJumpPage(
                        ayah.page
                    );


                    clearJumpError();


                    updateSurahInfo();


                    loadAyah();


                    playAudio();

                }
            );


            ayahContainer.appendChild(
                div
            );

        }
    );


    highlightCurrentAyah();

}


/* =========================================================
   SURAH INFO
========================================================= */

function updateSurahInfo(){

    const surah =
        surahData.find(
            item =>
                Number(item.number) ===
                Number(currentSurah)
        );


    if(surah){

        surahName.textContent =
            getSurahName(surah);

    }
    else{

        surahName.textContent =
            `سوره ${faNumber(
                currentSurah
            )}`;

    }


    const total =
        ayahData.length ||
        (
            surah
                ? surah.ayah_count
                : 0
        );


    surahInfo.textContent =
        `آیه ${faNumber(currentAyah)} از ${faNumber(total)}`;


    const current =
        ayahData.find(
            item =>
                Number(item.ayah_number) ===
                Number(currentAyah)
        );


    if(
        current &&
        current.page
    ){

        surahPage.style.display =
            "inline-block";


        surahPage.textContent =
            `📄 صفحه ${faNumber(
                current.page
            )}`;

    }
    else{

        surahPage.style.display =
            "none";

    }


    updateSurahNavigation();

}

========================================================= */

function showJumpPage(page){

        page === undefined ||
        page === ""

        hideJumpPage();

        return;

    }


    jumpPageBadge.style.display =

    jumpPageBadge.textContent =

}


function hideJumpPage(){

        "none";

}


/* =========================================================

========================================================= */

function clearJumpError(){

}


/* =========================================================
   CENTER ACTIVE AYAH
========================================================= */

function scrollCurrentAyahToCenter(){

    clearTimeout(
        centerScrollTimer
    );


    centerScrollTimer =
        setTimeout(
            () => {

                const current =
                    document.querySelector(
                        ".ayah.active"
                    );


                if(!current){

                    return;

                }


                const rect =
                    current.getBoundingClientRect();


                const header =
                    document.querySelector(
                        ".header"
                    );


                const headerHeight =
                    header
                        ? header.getBoundingClientRect().height
                        : 0;


                const target =
                    window.scrollY +
                    rect.top -
                    (
                        window.innerHeight / 2
                    ) +
                    (
                        rect.height / 2
                    ) -
                    (
                        headerHeight / 2
                    );


                window.scrollTo({

                    top:
                        Math.max(
                            0,
                            target
                        ),

                    behavior:
                        "smooth"

                });

            },
            80
        );

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightCurrentAyah(){

    document
        .querySelectorAll(
            ".ayah"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    const current =
        document.getElementById(
            `ayah-${currentAyah}`
        );


    if(current){

        current.classList.add(
            "active"
        );


        scrollCurrentAyahToCenter();

    }

}


/* =========================================================
   GO TO AYAH
========================================================= */

async function goToAyah(){

    clearJumpError();


    const requested =
        Number(
            ayahNumberInput.value
        );


    const total =
        ayahData.length;


    if(
        !Number.isInteger(requested) ||
        requested < 1
    ){

        jumpError.textContent =
            "لطفاً شماره آیه را وارد کنید.";

        return;

    }


    if(
        total &&
        requested > total
    ){

        jumpError.textContent =
            `این سوره فقط ${faNumber(total)} آیه دارد.`;

        return;

    }


    goAyahButton.disabled =
        true;


    goAyahButton.textContent =
        "در حال یافتن...";


    try{

        const target =
            ayahData.find(
                item =>
                    Number(
                        item.ayah_number
                    ) === requested
            );


        if(!target){

            throw new Error(
                "این آیه پیدا نشد."
            );

        }


        currentAyah =
            Number(
                target.ayah_number
            );


        if(
            currentAyah === 1 &&
            Number(currentSurah) !== 1 &&
            Number(currentSurah) !== 9
        ){

            bismillahPlayedForCurrentAyah =
                false;

        }
        else{

            bismillahPlayedForCurrentAyah =
                true;

        }


        isBismillahAudio =
            false;


        ayahNumberInput.value =
            currentAyah;


        showJumpPage(
            target.page
        );


        updateSurahInfo();


        loadAyah();


        playerStatus.textContent =
            `آیه ${faNumber(
                currentAyah
            )} آماده پخش است`;

    }
    catch(error){

        console.error(error);


        jumpError.textContent =
            error.message ||
            "خطا در پیدا کردن آیه.";

    }
    finally{

        goAyahButton.disabled =
            false;


        goAyahButton.textContent =
            "▶ رفتن به آیه";

    }

}


/* =========================================================
   GO TO PAGE
========================================================= */

async function goToPage(){

    clearJumpError();


    const requested =
        Number(
            pageNumberInput.value
        );


    if(
        !Number.isInteger(requested) ||
        requested < 1 ||
        requested > 604
    ){

        jumpError.textContent =
            "شماره صفحه باید بین ۱ تا ۶۰۴ باشد.";

        return;

    }


    goPageButton.disabled =
        true;


    goPageButton.textContent =
        "در حال یافتن...";


    try{

        const response =
            await fetch(
                `${WORKER_URL}/page?page=${requested}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const result =
            await response.json();


        if(
            !result.ok ||
            !result.first_ayah
        ){

            throw new Error(
                "این صفحه پیدا نشد."
            );

        }


        const first =
            result.first_ayah;


        const targetSurah =
            Number(
                first.surah_id
            );


        const targetAyah =
            Number(
                first.ayah_number
            );


        pageNumberInput.value =
            requested;


        await loadSurahAndAyah(
            targetSurah,
            targetAyah,
            false
        );


        showJumpPage(
            requested
        );


        playerStatus.textContent =
            `صفحه ${faNumber(requested)} آماده پخش است`;


        highlightCurrentAyah();

    }
    catch(error){

        console.error(error);


        jumpError.textContent =
            error.message ||
            "خطا در پیدا کردن صفحه.";

    }
    finally{

        goPageButton.disabled =
            false;


        goPageButton.textContent =
            "📄 رفتن به صفحه";

    }

}


/* =========================================================
   LOAD AYAH
========================================================= */

function loadAyah(){

    if(!ayahData.length){

        return;

    }


    const ayah =
        ayahData.find(
            item =>
                Number(
                    item.ayah_number
                ) ===
                Number(currentAyah)
        );


    if(!ayah){

        return;

    }


    const audioUrl =
        getAudioUrl(
            currentSurah,
            currentAyah
        );


    isBismillahAudio =
        false;


    audio.src =
        audioUrl;


    audio.preload =
        "auto";


    audio.load();


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    progress.style.width =
        "0%";


    playerStatus.textContent =
        `آیه ${faNumber(
            currentAyah
        )}`;


    highlightCurrentAyah();


    updateSurahInfo();


    setTimeout(
        () => {

            preloadNextAyah();

        },
        80
    );

}


/* =========================================================
   PLAY BISMILLAH
========================================================= */

async function playBismillah(){

    try{

        isBismillahAudio =
            true;


        audio.src =
            getBismillahAudioUrl();


        audio.preload =
            "auto";


        audio.load();


        currentTimeElement.textContent =
            "0:00";


        durationElement.textContent =
            "0:00";


        progress.style.width =
            "0%";


        playerStatus.textContent =
            "در حال پخش بسم‌الله";


        highlightCurrentAyah();


        nextAudio =
            new Audio();


        nextAudio.preload =
            "auto";


        nextAudioUrl =
            getAudioUrl(
                currentSurah,
                1
            );


        nextAudio.src =
            nextAudioUrl;


        nextAudio.load();


        await audio.play();

    }
    catch(error){

        console.error(error);


        isBismillahAudio =
            false;


        setPlayButtonState(false);


        playerStatus.textContent =
            "برای پخش، دوباره دکمه پخش را لمس کنید.";

    }

}


/* =========================================================
   PLAY AUDIO
========================================================= */

async function playAudio(){

    try{

        if(
            Number(currentSurah) === 1
        ){

            isBismillahAudio =
                false;

        }


        if(
            isBismillahAudio
        ){

            await audio.play();

            setPlayButtonState(true);

            return;

        }


        if(
            Number(currentAyah) === 1 &&
            Number(currentSurah) !== 1 &&
            Number(currentSurah) !== 9 &&
            !bismillahPlayedForCurrentAyah
        ){

            await playBismillah();

            return;

        }


        if(!audio.src){

            loadAyah();

        }


        await audio.play();


        setPlayButtonState(true);


        playerStatus.textContent =
            `در حال پخش آیه ${faNumber(
                currentAyah
            )}`;


        preloadNextAyah();

    }
    catch(error){

        console.error(error);


        setPlayButtonState(false);


        playerStatus.textContent =
            "برای پخش، دوباره دکمه پخش را لمس کنید.";

    }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseAudio(){

    audio.pause();


    setPlayButtonState(false);


    if(isBismillahAudio){

        playerStatus.textContent =
            "بسم‌الله";

    }
    else{

        playerStatus.textContent =
            `آیه ${faNumber(
                currentAyah
            )}`;

    }

}


/* =========================================================
   START SURAH
========================================================= */

startSurahButton.addEventListener(
    "click",
    async () => {

        if(!ayahData.length){

            return;

        }


        currentAyah =
            1;


        if(
            Number(currentSurah) === 1 ||
            Number(currentSurah) === 9
        ){

            bismillahPlayedForCurrentAyah =
                true;

        }
        else{

            bismillahPlayedForCurrentAyah =
                false;

        }


        isBismillahAudio =
            false;


        audio.pause();


        audio.removeAttribute(
            "src"
        );


        audio.load();


        clearNextAudio();


        currentTimeElement.textContent =
            "0:00";


        durationElement.textContent =
            "0:00";


        progress.style.width =

            showJumpPage(
                first.page

            hideJumpPage();

        }

/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(

        }
        else{

);


/* =========================================================
   PREVIOUS AYAH
========================================================= */

        }

                Number(currentSurah) !== 1 &&
                Number(currentSurah) !== 9
            ){

                bismillahPlayedForCurrentAyah =
                    false;

            }
            else{

                bismillahPlayedForCurrentAyah =
                    true;

            }


            isBismillahAudio =
                false;


            ayahNumberInput.value =
                currentAyah;


            const target =
                ayahData.find(
                    item =>
                        Number(
                            item.ayah_number
                        ) ===
                        Number(currentAyah)
                );


            if(target){

                showJumpPage(
                    target.page
                );

            }


            clearJumpError();

                "این اولین آیه سوره است.";

        }

/* =========================================================
   NEXT AYAH
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if(!ayahData.length){

            return;

        }


        if(
            currentAyah <
            ayahData.length
        ){

            currentAyah++;


            bismillahPlayedForCurrentAyah =
                true;


            isBismillahAudio =
                false;


            ayahNumberInput.value =
                currentAyah;


            const target =
                ayahData.find(
                    item =>
                        Number(
                            item.ayah_number
                        ) ===
                        Number(currentAyah)
                );


            if(target){

                showJumpPage(
                    target.page
                );

            }


            clearJumpError();


            loadAyah();


            await playAudio();

        }
        else{

            /*
                دکمه آیه بعدی در انتهای سوره،
                وارد سوره بعد می‌شود.
            */

            if(
                Number(currentSurah) <
                114
            ){

                await loadSurahAndAyah(
                    Number(currentSurah) + 1,
                    1,
                    true
                );

            }
            else{

                playerStatus.textContent =
                    "قرآن کریم به پایان رسید.";

                setPlayButtonState(false);

            }

        }

    }
);


/* =========================================================
   PREVIOUS / NEXT SURAH BUTTONS
========================================================= */

prevSurahButton.addEventListener(
    "click",

            Number(currentSurah) <= 1

        await loadSurahAndAyah(

nextSurahButton.addEventListener(

        ){

        }


        await loadSurahAndAyah(
            Number(currentSurah) + 1,
            1,

        );

    }
);


/* =========================================================
   AUDIO PLAY / PAUSE EVENTS
========================================================= */

audio.addEventListener(
    "play",
    () => {

        setPlayButtonState(true);

    }
);


audio.addEventListener(
    "pause",
    () => {

        /*
            هنگام پایان طبیعی نیز pause ممکن است
            قبل از ended رخ دهد؛ وضعیت نهایی در ended
            دوباره تنظیم می‌شود.
        */

        if(!audio.ended){

            setPlayButtonState(false);

        }

    }
);


audio.addEventListener(
    "ended",
    () => {

        setPlayButtonState(false);

    }
);


/* =========================================================
   AUDIO ENDED
========================================================= */

audio.addEventListener(
    "ended",
    async () => {

        /*
            =================================================
            بسم‌الله تمام شد
            =================================================
        */

        if(isBismillahAudio){

            isBismillahAudio =
                false;


            bismillahPlayedForCurrentAyah =
                true;


            currentAyah =
                1;


            ayahNumberInput.value =
                1;


            const firstAyahUrl =
                getAudioUrl(
                    currentSurah,
                    1
                );


            audio.src =
                firstAyahUrl;


            audio.preload =
                "auto";


            audio.load();


            highlightCurrentAyah();

            updateSurahInfo();


            try{

                await audio.play();

                setPlayButtonState(true);

                playerStatus.textContent =
                    `در حال پخش آیه ${faNumber(
                        currentAyah
                    )}`;

            }
            catch(error){

                console.error(error);

                setPlayButtonState(false);

            }


            preloadNextAyah();


            return;

        }


        /*
            =================================================
            آیه فعلی تمام شد
            =================================================
        */

        if(
            currentAyah <
            ayahData.length
        ){

            const nextAyahNumber =
                Number(currentAyah) + 1;


            currentAyah =
                nextAyahNumber;


            bismillahPlayedForCurrentAyah =
                true;


            isBismillahAudio =
                false;


            ayahNumberInput.value =
                currentAyah;


            highlightCurrentAyah();


            updateSurahInfo();


            const currentNextAyah =
                ayahData.find(
                    item =>
                        Number(
                            item.ayah_number
                        ) ===
                        Number(currentAyah)
                );


            if(currentNextAyah){

                showJumpPage(
                    currentNextAyah.page
                );

            }


            const nextUrl =
                getAudioUrl(
                    currentSurah,
                    currentAyah
                );


            audio.src =
                nextUrl;


            audio.preload =
                "auto";


            audio.load();


            currentTimeElement.textContent =
                "0:00";


            durationElement.textContent =
                "0:00";


            progress.style.width =
                "0%";


            playerStatus.textContent =
                `در حال پخش آیه ${faNumber(
                    currentAyah
                )}`;


            try{

                isAutoAdvancing =
                    true;


                await audio.play();

                setPlayButtonState(true);

            }
            catch(error){

                console.error(error);


                setPlayButtonState(false);


                playerStatus.textContent =
                    `آیه ${faNumber(
                        currentAyah
                    )} آماده پخش است`;

            }
            finally{

                isAutoAdvancing =
                    false;

            }


            preloadNextAyah();

        }
        else{

            /*
                =================================================
                پایان سوره
                =================================================

                اگر سوره ۱۱۴ نیست،
                بلافاصله سوره بعدی را بارگذاری و پخش می‌کنیم.
            */

            if(
                Number(currentSurah) <
                114
            ){

                const nextSurah =
                    Number(currentSurah) + 1;


                try{

                    await loadSurahAndAyah(
                        nextSurah,
                        1,
                        true
                    );

                }
                catch(error){

                    console.error(error);

                    setPlayButtonState(false);

                    playerStatus.textContent =
                        "خطا در رفتن به سوره بعد.";

                }

            }
            else{

                setPlayButtonState(false);

                playerStatus.textContent =
                    "قرآن کریم به پایان رسید.";

                clearNextAudio();

            }

        }

    }
);


/* =========================================================
   METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        if(
            Number.isFinite(
                audio.duration
            )
        ){

            durationElement.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =========================================================
   TIME UPDATE
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        const current =
            audio.currentTime || 0;


        const duration =
            audio.duration || 0;


        currentTimeElement.textContent =
            formatTime(current);


        if(duration > 0){

            const percent =
                (
                    current /
                    duration
                ) * 100;


            progress.style.width =
                `${Math.min(
                    100,
                    Math.max(
                        0,
                        percent
                    )
                )}%`;


            if(
                duration - current <
                2
            ){

                preloadNextAyah();

            }

        }

    }
);


/* =========================================================
   SEEK
========================================================= */

progressWrap.addEventListener(
    "click",
    event => {

        if(
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ){

            return;

        }


        const rect =
            progressWrap.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            position /
            rect.width;


        const safePercent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );


        audio.currentTime =
            safePercent *
            audio.duration;

    }
);


/* =========================================================
   SURAH SEARCH
========================================================= */

surahSearch.addEventListener(
    "input",
    () => {

        renderSurahList(
            surahSearch.value
        );

    }
);


/* =========================================================
   SEARCH ENTER
========================================================= */

surahSearch.addEventListener(
    "keydown",
    async event => {

        if(
            event.key !==
            "Enter"
        ){

            return;

        }


        event.preventDefault();


        const normalized =
            normalizeSearchText(
                surahSearch.value
            );


        if(!normalized){

            return;

        }


        const matches =
            surahData.filter(
                surah => {

                    const number =
                        String(
                            surah.number
                        );


                    const nameFa =
                        normalizeSearchText(
                            surah.name_fa
                        );

                    const nameAr =
                        normalizeSearchText(
                            surah.name_ar
                        );

                    const nameEn =
                        normalizeSearchText(
                            surah.name_en
                        );


                    return (
                        number === normalized ||
                        nameFa === normalized ||
                        nameAr === normalized ||
                        nameEn === normalized ||
                        nameFa.includes(
                            normalized
                        ) ||
                        nameAr.includes(
                            normalized
                        ) ||
                        nameEn.includes(
                            normalized
                        )
                    );

                }
            );


        if(matches.length){

            await selectSurah(
                Number(
                    matches[0].number
                )
            );

        }

    }
);

   GO AYAH

   ENTER AYAH

   MODES
========================================================= */

    );

    button => {

        button.addEventListener(
            "click",
            () => {

                modeButtons.forEach(

                    currentMode ===
                    "translation"
                ){

                    playerStatus.textContent =
                        "🇮🇷 فقط ترجمه";

                }
                else{

                    playerStatus.textContent =
                        "🔊🇮🇷 قرائت + ترجمه";

                }

            }
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }


        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();


            if(audio.paused){

                playAudio();

            }
            else{

                pauseAudio();

            }

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            prevButton.click();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            nextButton.click();

        }

    }
);


/* =========================================================
   START
========================================================= */

setPlayButtonState(false);

loadSurahs();

</script>
