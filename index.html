<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>قرآن کریم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f3f7f4;
    color:#173c2c;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    direction:rtl;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    background:#0b4b35;
    color:white;

    padding:
        14px
        14px
        12px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.12);
}

.header-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}


/* =========================
   SURAH SEARCH
========================= */

.surah-search{
    position:relative;
    margin-bottom:8px;
}

.surah-search-input{
    width:100%;

    border:none;
    outline:none;

    background:white;
    color:#173c2c;

    border-radius:12px;

    padding:
        11px
        42px
        11px
        12px;

    font-size:14px;
    font-weight:bold;

    direction:rtl;
}

.surah-search-input::placeholder{
    color:#91a29a;
}

.search-icon{
    position:absolute;

    right:13px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    color:#176c49;

    pointer-events:none;
}


/* =========================
   SURAH SELECT
========================= */

.surah-selector{
    display:flex;
    gap:8px;
    align-items:center;
}

.surah-selector select{
    flex:1;
    min-width:0;

    border:none;
    outline:none;

    background:white;
    color:#173c2c;

    border-radius:12px;

    padding:
        11px
        12px;

    font-size:15px;
    font-weight:bold;
}


/* =========================
   AYAH JUMP PANEL
========================= */

.ayah-jump{
    background:white;

    margin:
        12px
        12px
        0;

    padding:14px;

    border-radius:16px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.ayah-jump-title{
    color:#0b4b35;

    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;

    text-align:right;
}

.ayah-jump-row{
    display:flex;

    gap:8px;

    align-items:center;
}

.ayah-number-input{
    flex:1;

    min-width:0;

    border:
        1px solid
        #d6e3dc;

    outline:none;

    background:#f8fbf9;

    color:#173c2c;

    border-radius:11px;

    padding:
        11px
        12px;

    font-size:16px;

    font-weight:bold;

    text-align:center;

    direction:ltr;

    transition:
        border .2s,
        background .2s;
}

.ayah-number-input:focus{
    border-color:#27845a;

    background:white;
}

.go-ayah{
    border:none;

    border-radius:11px;

    background:#176c49;

    color:white;

    padding:
        11px
        15px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    box-shadow:
        0 3px 8px rgba(23,108,73,.18);
}

.go-ayah:active{
    transform:scale(.98);
}

.ayah-jump-hint{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:8px;

    color:#71877d;

    font-size:12px;
}

.page-badge{
    background:#edf7f1;

    color:#176c49;

    border-radius:8px;

    padding:
        5px
        8px;

    font-weight:bold;

    white-space:nowrap;
}

.jump-error{
    color:#b34b4b;

    font-size:12px;

    margin-top:7px;

    min-height:18px;
}


/* =========================
   SURAH INFO
========================= */

.surah-info{
    background:white;

    margin:12px;

    padding:14px;

    border-radius:16px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    text-align:center;
}

.surah-name{
    color:#0b4b35;
    font-size:21px;
    font-weight:bold;
    margin-bottom:5px;
}

.surah-meta{
    color:#648073;
    font-size:13px;
}

.surah-page{
    display:inline-block;

    margin-top:8px;

    background:#edf7f1;

    color:#176c49;

    padding:
        5px
        10px;

    border-radius:9px;

    font-size:12px;

    font-weight:bold;
}


/* =========================
   MODES
========================= */

.modes{
    display:flex;

    gap:8px;

    margin:
        0
        12px
        12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.modes::-webkit-scrollbar{
    display:none;
}

.mode{
    flex:1;

    min-width:115px;

    border:
        1px solid
        #cfe0d7;

    background:white;

    color:#176c49;

    border-radius:12px;

    padding:
        10px
        8px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.mode.active{
    background:#176c49;
    color:white;

    border-color:#176c49;

    box-shadow:
        0 3px 8px rgba(23,108,73,.2);
}


/* =========================
   PLAYER
========================= */

.player{
    background:white;

    margin:
        0
        12px
        12px;

    padding:14px;

    border-radius:18px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.08);
}

.player-status{
    text-align:center;

    font-size:14px;

    color:#547265;

    margin-bottom:10px;
}


/* =========================
   START SURAH
========================= */

.start-surah{
    width:100%;

    border:none;

    border-radius:12px;

    background:#f39c12;

    color:white;

    padding:
        10px
        12px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;

    transition:
        transform .15s,
        background .15s;
}

.start-surah:active{
    transform:scale(.99);
}

.start-surah.playing{
    background:#e67e22;
    color:white;
}


/* =========================
   PROGRESS
========================= */

.progress-wrap{
    width:100%;

    height:7px;

    background:#e2ebe6;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.progress{
    width:0%;

    height:100%;

    background:#176c49;

    transition:
        width .1s linear;
}

.time-row{
    display:flex;

    justify-content:space-between;

    direction:ltr;

    margin-top:6px;

    color:#6d8077;

    font-size:12px;
}


/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:18px;

    margin-top:15px;

    direction:rtl;
}

.control-box{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    min-width:62px;
}

.control{
    width:52px;
    height:52px;

    border:none;

    border-radius:50%;

    background:#e9f2ed;

    color:#176c49;

    font-size:25px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);

    transition:
        transform .15s,
        background .15s;

    line-height:1;
}

.control:active{
    transform:scale(.92);
}

.control.play{
    width:64px;
    height:64px;

    background:#176c49;

    color:white;

    font-size:28px;
}

.control-label{
    margin-top:5px;

    font-size:11px;

    color:#668277;

    white-space:nowrap;

    line-height:1.2;
}


/* =========================
   AYAH CONTAINER
========================= */

.ayah-container{
    padding:
        0
        12px
        30px;
}


/* =========================
   BISMILLAH
========================= */

.bismillah{
    text-align:center;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2;

    font-weight:700;

    color:#0b4b35;

    margin:
        4px
        0
        18px;

    padding:
        4px
        8px
        14px;

    border-bottom:
        1px solid
        #dfe8e2;
}


/* =========================
   AYAH
========================= */

.ayah{
    background:white;

    border-radius:18px;

    margin-bottom:12px;

    padding:16px;

    border:
        1px solid
        #e4ece7;

    box-shadow:
        0 2px 9px rgba(0,0,0,.045);

    cursor:pointer;

    transition:
        background .2s,
        border .2s,
        transform .15s;
}

.ayah:active{
    transform:scale(.995);
}

.ayah.active{
    background:#edf7f1;

    border:
        2px solid
        #27845a;

    box-shadow:
        0 4px 15px rgba(23,108,73,.12);
}


/* =========================
   ARABIC
========================= */

.arabic{
    direction:rtl;

    text-align:right;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2.25;

    font-weight:700;

    color:#173c2c;
}

.ayah-number{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    width:30px;
    height:30px;

    margin-left:8px;

    border-radius:50%;

    background:#176c49;

    color:white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:12px;

    vertical-align:middle;
}


/* =========================
   TRANSLATION
========================= */

.translation{
    margin-top:13px;

    padding-top:12px;

    border-top:
        1px solid
        #edf1ee;

    color:#45675a;

    font-size:16px;

    line-height:2;

    font-weight:bold;

    text-align:right;
}

.translation-empty{
    color:#94a69e;

    font-size:13px;

    font-weight:normal;
}


/* =========================
   LOADING
========================= */

.loading{
    text-align:center;

    padding:35px 15px;

    color:#668276;

    font-size:15px;
}

.error{
    margin:20px 12px;

    padding:16px;

    background:#fff0f0;

    color:#a33;

    border-radius:12px;

    text-align:center;

    line-height:1.9;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header-title{
        font-size:20px;
    }

    .surah-info{
        margin-top:10px;
    }

    .arabic{
        font-size:24px;
        line-height:2.2;
    }

    .translation{
        font-size:15px;
    }

    .controls{
        gap:13px;
    }

    .control{
        width:48px;
        height:48px;
        font-size:23px;
    }

    .control.play{
        width:60px;
        height:60px;
    }

    .control-box{
        min-width:58px;
    }

    .control-label{
        font-size:10px;
    }

    .bismillah{
        font-size:23px;
    }

    .ayah-jump-row{
        gap:6px;
    }

    .go-ayah{
        padding-left:12px;
        padding-right:12px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-title">
            📖 قرآن کریم
        </div>


        <!-- جستجوی سوره -->

        <div class="surah-search">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="surahSearch"
                class="surah-search-input"
                type="search"
                autocomplete="off"
                placeholder="جستجوی نام سوره..."
            >

        </div>


        <!-- انتخاب سوره -->

        <div class="surah-selector">

            <select id="surahSelect">

                <option value="">
                    در حال دریافت سوره‌ها...
                </option>

            </select>

        </div>

    </header>


    <!-- انتخاب آیه -->

    <section class="ayah-jump">

        <div class="ayah-jump-title">
            🎯 رفتن مستقیم به آیه
        </div>

        <div class="ayah-jump-row">

            <input
                id="ayahNumberInput"
                class="ayah-number-input"
                type="number"
                inputmode="numeric"
                min="1"
                placeholder="شماره آیه"
            >

            <button
                id="goAyah"
                class="go-ayah"
                type="button"
            >
                ▶ رفتن به آیه
            </button>

        </div>

        <div class="ayah-jump-hint">

            <span id="ayahCountHint">
                ابتدا یک سوره انتخاب کنید.
            </span>

            <span
                id="jumpPageBadge"
                class="page-badge"
                style="display:none;"
            >
                صفحه —
            </span>

        </div>

        <div
            id="jumpError"
            class="jump-error"
        ></div>

    </section>


    <!-- SURAH INFO -->

    <section class="surah-info">

        <div
            class="surah-name"
            id="surahName"
        >
            قرآن کریم
        </div>

        <div
            class="surah-meta"
            id="surahInfo"
        >
            در حال آماده‌سازی...
        </div>

        <div
            id="surahPage"
            class="surah-page"
            style="display:none;"
        >
            📄 صفحه —
        </div>

    </section>


    <!-- MODES -->

    <div class="modes">

        <button
            class="mode active"
            data-mode="arabic"
        >
            🔊 فقط قرائت
        </button>

        <button
            class="mode"
            data-mode="translation"
        >
            🇮🇷 فقط ترجمه
        </button>

        <button
            class="mode"
            data-mode="both"
        >
            🔊🇮🇷 قرائت + ترجمه
        </button>

    </div>


    <!-- PLAYER -->

    <section class="player">

        <div
            class="player-status"
            id="playerStatus"
        >
            آماده پخش
        </div>


        <button
            class="start-surah"
            id="startSurah"
            type="button"
        >
            ▶ شروع سوره
        </button>


        <div
            class="progress-wrap"
            id="progressWrap"
        >

            <div
                class="progress"
                id="progress"
            ></div>

        </div>


        <div class="time-row">

            <span id="duration">
                0:00
            </span>

            <span id="currentTime">
                0:00
            </span>

        </div>


        <div class="controls">


            <div class="control-box">

                <button
                    class="control"
                    id="prev"
                    title="آیه قبلی"
                    aria-label="آیه قبلی"
                >
                    →
                </button>

                <div class="control-label">
                    آیه قبلی
                </div>

            </div>


            <div class="control-box">

                <button
                    class="control play"
                    id="play"
                    title="پخش"
                    aria-label="پخش"
                >
                    ▶
                </button>

                <div class="control-label">
                    پخش
                </div>

            </div>


            <div class="control-box">

                <button
                    class="control"
                    id="next"
                    title="آیه بعدی"
                    aria-label="آیه بعدی"
                >
                    ←
                </button>

                <div class="control-label">
                    آیه بعدی
                </div>

            </div>


        </div>

    </section>


    <!-- AYAH CONTAINER -->

    <main
        class="ayah-container"
        id="ayahContainer"
    >

        <div class="loading">
            در حال دریافت آیات...
        </div>

    </main>

</div>


<audio
    id="audio"
    preload="metadata"
></audio>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
    "https://quran-importer.dehghaniweb.workers.dev";

const SUPABASE_URL =
    "https://wiulmslaensqnwlcjxtp.supabase.co";

const SUPABASE_BASE =
    SUPABASE_URL +
    "/storage/v1/object/public/quran-audio/arabic/";


/* =========================================================
   STATE
========================================================= */

let surahData = [];

let ayahData = [];

let currentSurah = 1;

let currentAyah = 1;

let currentMode = "arabic";

let isLoading = false;

let bismillahPlayedForCurrentAyah = false;

let isBismillahAudio = false;


/* =========================================================
   DOM
========================================================= */

const surahSelect =
    document.getElementById("surahSelect");

const surahSearch =
    document.getElementById("surahSearch");

const surahName =
    document.getElementById("surahName");

const surahInfo =
    document.getElementById("surahInfo");

const surahPage =
    document.getElementById("surahPage");

const ayahContainer =
    document.getElementById("ayahContainer");

const ayahNumberInput =
    document.getElementById("ayahNumberInput");

const ayahCountHint =
    document.getElementById("ayahCountHint");

const jumpPageBadge =
    document.getElementById("jumpPageBadge");

const jumpError =
    document.getElementById("jumpError");

const goAyahButton =
    document.getElementById("goAyah");

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const startSurahButton =
    document.getElementById("startSurah");

const progress =
    document.getElementById("progress");

const progressWrap =
    document.getElementById("progressWrap");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");

const playerStatus =
    document.getElementById("playerStatus");


/* =========================================================
   PERSIAN NUMBERS
========================================================= */

function faNumber(value){

    return String(value)
        .replace(
            /\d/g,
            d => "۰۱۲۳۴۵۶۷۸۹"[Number(d)]
        );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${minutes}:${secs}`;

}


/* =========================================================
   SURAH NAME
========================================================= */

function getSurahName(surah){

    if(
        surah &&
        surah.name_fa
    ){

        return surah.name_fa;

    }

    if(
        surah &&
        surah.name_ar
    ){

        return surah.name_ar;

    }

    if(
        surah &&
        surah.name
    ){

        return surah.name;

    }

    if(
        surah &&
        surah.number
    ){

        return `سوره ${faNumber(surah.number)}`;

    }

    return "سوره";

}


/* =========================================================
   NORMALIZE SEARCH TEXT
========================================================= */

function normalizeSearchText(text){

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ة/g,"ه")
        .replace(/ۀ/g,"ه")
        .replace(/أ/g,"ا")
        .replace(/إ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/َ|ً|ُ|ٌ|ِ|ٍ|ْ|ّ|ـ/g,"");

}


/* =========================================================
   AUDIO URL
========================================================= */

function getBismillahAudioUrl(){

    return (
        SUPABASE_BASE +
        "001/001001.mp3"
    );

}


function getAudioUrl(
    surahId,
    ayahNumber
){

    const surah =
        String(surahId)
        .padStart(3,"0");

    let fileNumber =
        Number(ayahNumber);

    if(
        Number(surahId) === 1
    ){

        fileNumber =
            Number(ayahNumber) + 1;

    }

    const ayah =
        String(fileNumber)
        .padStart(3,"0");

    return (
        SUPABASE_BASE +
        `${surah}/${surah}${ayah}.mp3`
    );

}


/* =========================================================
   LOAD SURAHS
========================================================= */

async function loadSurahs(){

    try{

        surahSelect.innerHTML =
            `
            <option value="">
                در حال دریافت سوره‌ها...
            </option>
            `;

        const response =
            await fetch(
                `${WORKER_URL}/surahs`
            );

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const result =
            await response.json();

        if(
            !result.ok ||
            !Array.isArray(result.surahs)
        ){

            throw new Error(
                "اطلاعات سوره‌ها از Worker دریافت نشد."
            );

        }

        surahData =
            result.surahs;

        renderSurahList();

        await loadAyahs();

    }
    catch(error){

        console.error(error);

        surahSelect.innerHTML =
            `
            <option>
                خطا در دریافت سوره‌ها
            </option>
            `;

        ayahContainer.innerHTML =
            `
            <div class="error">
                دریافت اطلاعات سوره‌ها با خطا مواجه شد.
                <br>
                ${error.message || ""}
            </div>
            `;

    }

}


/* =========================================================
   RENDER SURAH LIST
========================================================= */

function renderSurahList(
    filterText = ""
){

    const normalized =
        normalizeSearchText(
            filterText
        );

    surahSelect.innerHTML = "";


    const filtered =
        surahData.filter(
            surah => {

                if(!normalized){
                    return true;
                }

                const number =
                    String(
                        surah.number
                    );

                const nameFa =
                    normalizeSearchText(
                        surah.name_fa
                    );

                const nameAr =
                    normalizeSearchText(
                        surah.name_ar
                    );

                const nameEn =
                    normalizeSearchText(
                        surah.name_en
                    );

                return (
                    number.includes(normalized) ||
                    nameFa.includes(normalized) ||
                    nameAr.includes(normalized) ||
                    nameEn.includes(normalized)
                );

            }
        );


    if(!filtered.length){

        const option =
            document.createElement(
                "option"
            );

        option.value = "";

        option.textContent =
            "سوره‌ای پیدا نشد";

        surahSelect.appendChild(
            option
        );

        return;

    }


    filtered.forEach(
        surah => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                surah.number;

            option.textContent =
                `${faNumber(surah.number)} - ${getSurahName(surah)}`;

            if(
                Number(surah.number) ===
                Number(currentSurah)
            ){

                option.selected =
                    true;

            }

            surahSelect.appendChild(
                option
            );

        }
    );

}

/* =========================================================
   EXTRACT BISMILLAH
========================================================= */

function extractBismillah(text){

    if(!text){

        return {
            bismillah:"",
            remaining:""
        };

    }


    const normalized =
        text.normalize("NFC");


    const patterns = [

        "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",

        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",

        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",

        "بِّسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"

    ];


    for(
        const pattern of patterns
    ){

        const p =
            pattern.normalize("NFC");


        if(
            normalized.startsWith(p)
        ){

            return {

                bismillah:
                    normalized.substring(
                        0,
                        p.length
                    ),

                remaining:
                    normalized
                    .substring(p.length)
                    .trim()

            };

        }

    }


    return {

        bismillah:"",

        remaining:
            normalized

    };

}


/* =========================================================
   RENDER AYAHS
========================================================= */

function renderAyahs(){

    ayahContainer.innerHTML = "";


    ayahData.forEach(
        ayah => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "ayah";

            div.id =
                `ayah-${ayah.ayah_number}`;

            div.dataset.ayah =
                ayah.ayah_number;


            let arabicText =
                ayah.text_ar || "";

            let bismillah = "";


            if(
                Number(currentSurah) !== 1 &&
                Number(currentSurah) !== 9 &&
                Number(ayah.ayah_number) === 1
            ){

                const extracted =
                    extractBismillah(
                        arabicText
                    );

                bismillah =
                    extracted.bismillah;

                arabicText =
                    extracted.remaining;

            }


            const translation =
                ayah.text_fa &&
                ayah.text_fa.trim()
                    ? ayah.text_fa
                    : "";


            let html = "";


            if(bismillah){

                html +=
                    `
                    <div class="bismillah">
                        ${bismillah}
                    </div>
                    `;

            }


            html +=
                `
                <div class="arabic">

                    <span class="ayah-number">
                        ${faNumber(
                            ayah.ayah_number
                        )}
                    </span>

                    ${arabicText}

                </div>

                <div class="translation">

                    ${
                        translation

                        ? translation

                        :

                        `
                        <span class="translation-empty">
                            ترجمه فارسی در مرحله بعد اضافه می‌شود.
                        </span>
                        `
                    }

                </div>
                `;


            div.innerHTML =
                html;


            div.addEventListener(
                "click",
                () => {

                    currentAyah =
                        Number(
                            ayah.ayah_number
                        );


                    if(
                        currentAyah === 1 &&
                        Number(currentSurah) !== 9
                    ){

                        bismillahPlayedForCurrentAyah =
                            false;

                    }
                    else{

                        bismillahPlayedForCurrentAyah =
                            true;

                    }


                    ayahNumberInput.value =
                        currentAyah;


                    clearJumpError();

                    updateSurahInfo();

                    loadAyah();

                    playAudio();

                }
            );


            ayahContainer.appendChild(
                div
            );

        }
    );


    highlightCurrentAyah();

}

/* =========================================================
   GO TO AYAH
========================================================= */

async function goToAyah(){

    clearJumpError();


    const requested =
        Number(
            ayahNumberInput.value
        );


    const total =
        ayahData.length;


    if(
        !Number.isInteger(requested) ||
        requested < 1
    ){

        jumpError.textContent =
            "لطفاً شماره آیه را وارد کنید.";

        return;

    }


    if(
        total &&
        requested > total
    ){

        jumpError.textContent =
            `این سوره فقط ${faNumber(total)} آیه دارد.`;

        return;

    }


    goAyahButton.disabled =
        true;

    goAyahButton.textContent =
        "در حال یافتن...";


    try{

        /*
            ابتدا از API دقیق آیه استفاده می‌کنیم.
            بنابراین page نیز از دیتابیس گرفته می‌شود.
        */

        const response =
            await fetch(
                `${WORKER_URL}/ayah?surah=${encodeURIComponent(currentSurah)}&ayah=${encodeURIComponent(requested)}`
            );


        if(!response.ok){

            if(response.status === 404){

                throw new Error(
                    "این آیه پیدا نشد."
                );

            }

            throw new Error(
                `خطا در دریافت آیه (${response.status})`
            );

        }


        const result =
            await response.json();


        if(
            !result.ok ||
            !result.ayah
        ){

            throw new Error(
                "اطلاعات آیه دریافت نشد."
            );

        }


        const target =
            result.ayah;


        currentAyah =
            Number(
                target.ayah_number
            );


        /*
            آیه اول:
            توبه بسم‌الله ندارد.
        */

        if(
            currentAyah === 1 &&
            Number(currentSurah) !== 9
        ){

            bismillahPlayedForCurrentAyah =
                false;

        }
        else{

            bismillahPlayedForCurrentAyah =
                true;

        }


        isBismillahAudio =
            false;


        /*
            اگر داده آیه از قبل در صفحه موجود باشد،
            فقط همان آیه را فعال می‌کنیم.
        */

        ayahNumberInput.value =
            currentAyah;


        showJumpPage(
            target.page
        );


        updateSurahInfo();

        loadAyah();

        highlightCurrentAyah();


        /*
            وضعیت پخش آماده است.
            کاربر با دکمه پخش تصمیم می‌گیرد.
        */

        playerStatus.textContent =
            `آیه ${faNumber(currentAyah)} آماده پخش است`;


        const targetElement =
            document.getElementById(
                `ayah-${currentAyah}`
            );


        if(targetElement){

            setTimeout(
                () => {

                    targetElement.scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                },
                100
            );

        }

    }
    catch(error){

        console.error(error);

        jumpError.textContent =
            error.message ||
            "خطا در پیدا کردن آیه.";

    }
    finally{

        goAyahButton.disabled =
            false;

        goAyahButton.textContent =
            "▶ رفتن به آیه";

    }

}

/* =========================================================
   PLAY
========================================================= */

async function playAudio(){

    try{

        if(
            isBismillahAudio
        ){

            await audio.play();

            playButton.textContent =
                "⏸";

            playButton.title =
                "توقف";

            return;

        }


        if(
            Number(currentAyah) === 1 &&
            Number(currentSurah) !== 9 &&
            !bismillahPlayedForCurrentAyah
        ){

            await playBismillah();

            return;

        }


        if(!audio.src){

            loadAyah();

        }


        await audio.play();


        playButton.textContent =
            "⏸";

        playButton.title =
            "توقف";


        playerStatus.textContent =
            `در حال پخش آیه ${faNumber(currentAyah)}`;

    }
    catch(error){

        console.error(error);

        playerStatus.textContent =
            "برای پخش، دوباره دکمه پخش را لمس کنید.";

    }

}

/* =========================================================
   TIME UPDATE
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        const current =
            audio.currentTime || 0;

        const duration =
            audio.duration || 0;


        currentTimeElement.textContent =
            formatTime(current);


        if(duration > 0){

            const percent =
                (
                    current /
                    duration
                ) * 100;


            progress.style.width =
                `${Math.min(
                    100,
                    Math.max(
                        0,
                        percent
                    )
                )}%`;

        }

    }
);


/* =========================================================
   SEEK
========================================================= */

progressWrap.addEventListener(
    "click",
    event => {

        if(
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ){

            return;

        }


        const rect =
            progressWrap.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            position /
            rect.width;


        const safePercent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );


        audio.currentTime =
            safePercent *
            audio.duration;

    }
);

surahSearch.addEventListener(
    "input",
    () => {

        renderSurahList(
            surahSearch.value
        );


        /*

            همان را انتخاب کن.
        */

        const normalized =
            normalizeSearchText(
                surahSearch.value
            );


        if(!normalized){
            return;
        }


        const matches =
            surahData.filter(
                surah => {

                    const number =
                        String(
                            surah.number
                        );

                    const nameFa =
                        normalizeSearchText(
                            surah.name_fa
                        );

                    const nameAr =
                        normalizeSearchText(
                            surah.name_ar
                        );

                    const nameEn =
                        normalizeSearchText(
                            surah.name_en
                        );

                    return (
                        number.includes(normalized) ||
                        nameFa.includes(normalized) ||
                        nameAr.includes(normalized) ||
                        nameEn.includes(normalized)
                    );

                }
            );


        if(matches.length === 1){

            surahSelect.value =
                String(
                    matches[0].number
                );

        }

    }
);

   SEARCH ENTER
========================================================= */

surahSearch.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Enter"
        ){

            return;

        }


        const normalized =
            normalizeSearchText(
                surahSearch.value
            );


        if(!normalized){
            return;
        }


        const matches =
            surahData.filter(
                surah => {

                    const number =
                        String(
                            surah.number
                        );

                    const nameFa =
                        normalizeSearchText(
                            surah.name_fa
                        );

                    const nameAr =
                        normalizeSearchText(
                            surah.name_ar
                        );

                    const nameEn =
                        normalizeSearchText(
                            surah.name_en
                        );

                    return (
                        number === normalized ||
                        nameFa === normalized ||
                        nameAr === normalized ||
                        nameEn === normalized ||
                        nameFa.includes(normalized) ||
                        nameAr.includes(normalized) ||
                        nameEn.includes(normalized)
                    );

                }
            );


        if(matches.length){

            const selected =
                matches[0];


            surahSelect.value =
                String(
                    selected.number
                );


            surahSelect.dispatchEvent(
                new Event("change")
            );

        }

    }
);


/* =========================================================
   GO AYAH BUTTON
========================================================= */

goAyahButton.addEventListener(
    "click",
    goToAyah
);


/* =========================================================
   ENTER IN AYAH INPUT
========================================================= */

ayahNumberInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            goToAyah();

        }

    }
);


/* =========================================================
   MODES
========================================================= */

const modeButtons =
    document.querySelectorAll(
        ".mode"
    );


modeButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                modeButtons.forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                currentMode =
                    button.dataset.mode;


                if(
                    currentMode ===
                    "arabic"
                ){

                    playerStatus.textContent =
                        "🔊 فقط قرائت";

                }
                else if(
                    currentMode ===
                    "translation"
                ){

                    playerStatus.textContent =
                        "🇮🇷 فقط ترجمه";

                }
                else{

                    playerStatus.textContent =
                        "🔊🇮🇷 قرائت + ترجمه";

                }

            }
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
            اگر کاربر داخل input تایپ می‌کند،
            کلیدهای جهت‌دار پخش را کنترل نکنند.
        */

        if(
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }


        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            if(audio.paused){

                playAudio();

            }
            else{

                pauseAudio();

            }

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            prevButton.click();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            nextButton.click();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadSurahs();

</script>

</body>
</html>
