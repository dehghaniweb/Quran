<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>قرآن کریم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f3f7f4;
    color:#173c2c;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
    direction:rtl;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    background:#0b4b35;
    color:white;

    padding:
        14px
        14px
        12px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.12);
}

.header-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.surah-selector{
    display:flex;
    gap:8px;
    align-items:center;
}

.surah-selector select{
    flex:1;
    min-width:0;

    border:none;
    outline:none;

    background:white;
    color:#173c2c;

    border-radius:12px;

    padding:
        11px
        12px;

    font-size:15px;
    font-weight:bold;
}


/* =========================
   SURAH INFO
========================= */

.surah-info{
    background:white;

    margin:12px;

    padding:14px;

    border-radius:16px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    text-align:center;
}

.surah-name{
    color:#0b4b35;
    font-size:21px;
    font-weight:bold;
    margin-bottom:5px;
}

.surah-meta{
    color:#648073;
    font-size:13px;
}


/* =========================
   MODES
========================= */

.modes{
    display:flex;

    gap:8px;

    margin:
        0
        12px
        12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.modes::-webkit-scrollbar{
    display:none;
}

.mode{
    flex:1;

    min-width:115px;

    border:
        1px solid
        #cfe0d7;

    background:white;

    color:#176c49;

    border-radius:12px;

    padding:
        10px
        8px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.mode.active{
    background:#176c49;
    color:white;

    border-color:#176c49;

    box-shadow:
        0 3px 8px rgba(23,108,73,.2);
}


/* =========================
   PLAYER
========================= */

.player{
    background:white;

    margin:
        0
        12px
        12px;

    padding:14px;

    border-radius:18px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.08);
}

.player-status{
    text-align:center;

    font-size:14px;

    color:#547265;

    margin-bottom:10px;
}

.progress-wrap{
    width:100%;

    height:7px;

    background:#e2ebe6;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;
}

.progress{
    width:0%;

    height:100%;

    background:#176c49;

    transition:
        width .1s linear;
}

.time-row{
    display:flex;

    justify-content:space-between;

    direction:ltr;

    margin-top:6px;

    color:#6d8077;

    font-size:12px;
}


/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:18px;

    margin-top:15px;

    direction:rtl;
}

.control-box{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    min-width:62px;
}

.control{
    width:52px;
    height:52px;

    border:none;

    border-radius:50%;

    background:#e9f2ed;

    color:#176c49;

    font-size:25px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);

    transition:
        transform .15s,
        background .15s;

    line-height:1;
}

.control:active{
    transform:scale(.92);
}

.control.play{
    width:64px;
    height:64px;

    background:#176c49;

    color:white;

    font-size:28px;
}

.control-label{
    margin-top:5px;

    font-size:11px;

    color:#668277;

    white-space:nowrap;

    line-height:1.2;
}


/* =========================
   AYAH CONTAINER
========================= */

.ayah-container{
    padding:
        0
        12px
        30px;
}


/* =========================
   BISMILLAH
========================= */

.bismillah{
    text-align:center;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2;

    font-weight:700;

    color:#0b4b35;

    margin:
        4px
        0
        18px;

    padding:
        4px
        8px
        14px;

    border-bottom:
        1px solid
        #dfe8e2;
}


/* =========================
   AYAH
========================= */

.ayah{
    background:white;

    border-radius:18px;

    margin-bottom:12px;

    padding:16px;

    border:
        1px solid
        #e4ece7;

    box-shadow:
        0 2px 9px rgba(0,0,0,.045);

    cursor:pointer;

    transition:
        background .2s,
        border .2s,
        transform .15s;
}

.ayah:active{
    transform:scale(.995);
}

.ayah.active{
    background:#edf7f1;

    border:
        2px solid
        #27845a;

    box-shadow:
        0 4px 15px rgba(23,108,73,.12);
}


/* =========================
   ARABIC
========================= */

.arabic{
    direction:rtl;

    text-align:right;

    font-family:
        "Amiri",
        "Traditional Arabic",
        serif;

    font-size:25px;

    line-height:2.25;

    font-weight:700;

    color:#173c2c;
}

.ayah-number{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    width:30px;
    height:30px;

    margin-left:8px;

    border-radius:50%;

    background:#176c49;

    color:white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:12px;

    vertical-align:middle;
}


/* =========================
   TRANSLATION
========================= */

.translation{
    margin-top:13px;

    padding-top:12px;

    border-top:
        1px solid
        #edf1ee;

    color:#45675a;

    font-size:16px;

    line-height:2;

    font-weight:bold;

    text-align:right;
}

.translation-empty{
    color:#94a69e;

    font-size:13px;

    font-weight:normal;
}


/* =========================
   LOADING
========================= */

.loading{
    text-align:center;

    padding:35px 15px;

    color:#668276;

    font-size:15px;
}

.error{
    margin:20px 12px;

    padding:16px;

    background:#fff0f0;

    color:#a33;

    border-radius:12px;

    text-align:center;

    line-height:1.9;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header-title{
        font-size:20px;
    }

    .surah-info{
        margin-top:10px;
    }

    .arabic{
        font-size:24px;
        line-height:2.2;
    }

    .translation{
        font-size:15px;
    }

    .controls{
        gap:13px;
    }

    .control{
        width:48px;
        height:48px;
        font-size:23px;
    }

    .control.play{
        width:60px;
        height:60px;
    }

    .control-box{
        min-width:58px;
    }

    .control-label{
        font-size:10px;
    }

    .bismillah{
        font-size:23px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-title">
            📖 قرآن کریم
        </div>

        <div class="surah-selector">

            <select id="surahSelect">

                <option value="">
                    در حال دریافت سوره‌ها...
                </option>

            </select>

        </div>

    </header>


    <!-- SURAH INFO -->

    <section class="surah-info">

        <div
            class="surah-name"
            id="surahName"
        >
            قرآن کریم
        </div>

        <div
            class="surah-meta"
            id="surahInfo"
        >
            در حال آماده‌سازی...
        </div>

    </section>


    <!-- MODES -->

    <div class="modes">

        <button
            class="mode active"
            data-mode="arabic"
        >
            🔊 فقط قرائت
        </button>

        <button
            class="mode"
            data-mode="translation"
        >
            🇮🇷 فقط ترجمه
        </button>

        <button
            class="mode"
            data-mode="both"
        >
            🔊🇮🇷 قرائت + ترجمه
        </button>

    </div>


    <!-- PLAYER -->

    <section class="player">

        <div
            class="player-status"
            id="playerStatus"
        >
            آماده پخش
        </div>


        <div
            class="progress-wrap"
            id="progressWrap"
        >

            <div
                class="progress"
                id="progress"
            ></div>

        </div>


        <div class="time-row">

            <span id="duration">
                0:00
            </span>

            <span id="currentTime">
                0:00
            </span>

        </div>


        <!--
            RTL:
            راست = قبلی
            وسط = پخش
            چپ = بعدی
        -->

        <div class="controls">


            <!-- آیه قبلی - سمت راست -->

            <div class="control-box">

                <button
                    class="control"
                    id="prev"
                    title="آیه قبلی"
                    aria-label="آیه قبلی"
                >
                    →
                </button>

                <div class="control-label">
                    آیه قبلی
                </div>

            </div>


            <!-- پخش - وسط -->

            <div class="control-box">

                <button
                    class="control play"
                    id="play"
                    title="پخش"
                    aria-label="پخش"
                >
                    ▶
                </button>

                <div class="control-label">
                    پخش
                </div>

            </div>


            <!-- آیه بعدی - سمت چپ -->

            <div class="control-box">

                <button
                    class="control"
                    id="next"
                    title="آیه بعدی"
                    aria-label="آیه بعدی"
                >
                    ←
                </button>

                <div class="control-label">
                    آیه بعدی
                </div>

            </div>


        </div>

    </section>


    <!-- AYAH CONTAINER -->

    <main
        class="ayah-container"
        id="ayahContainer"
    >

        <div class="loading">
            در حال دریافت آیات...
        </div>

    </main>

</div>


<!-- AUDIO -->

<audio
    id="audio"
    preload="metadata"
></audio>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
    "https://quran-importer.dehghaniweb.workers.dev";

const SUPABASE_URL =
    "https://wiulmslaensqnwlcjxtp.supabase.co";

const SUPABASE_BASE =
    SUPABASE_URL +
    "/storage/v1/object/public/quran-audio/arabic/";


/* =========================================================
   STATE
========================================================= */

let surahData = [];

let ayahData = [];

let currentSurah = 1;

let currentAyah = 1;

let currentMode = "arabic";

let isLoading = false;


/*
    وضعیت پخش بسم‌الله

    false:
    هنوز بسم‌الله این آیه پخش نشده

    true:
    بسم‌الله برای آیه اول این سوره پخش شده
*/
let bismillahPlayedForCurrentAyah = false;


/*
    مشخص می‌کند فایل فعلی که در audio قرار دارد
    فایل بسم‌الله است یا فایل آیه.
*/
let isBismillahAudio = false;


/* =========================================================
   DOM
========================================================= */

const surahSelect =
    document.getElementById("surahSelect");

const surahName =
    document.getElementById("surahName");

const surahInfo =
    document.getElementById("surahInfo");

const ayahContainer =
    document.getElementById("ayahContainer");

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const progress =
    document.getElementById("progress");

const progressWrap =
    document.getElementById("progressWrap");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");

const playerStatus =
    document.getElementById("playerStatus");


/* =========================================================
   PERSIAN NUMBERS
========================================================= */

function faNumber(value){

    return String(value)
        .replace(
            /\d/g,
            d => "۰۱۲۳۴۵۶۷۸۹"[Number(d)]
        );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${minutes}:${secs}`;

}


/* =========================================================
   SURAH NAME
========================================================= */

function getSurahName(surah){

    if(
        surah &&
        surah.name_fa
    ){

        return surah.name_fa;

    }

    if(
        surah &&
        surah.name_ar
    ){

        return surah.name_ar;

    }

    if(
        surah &&
        surah.name
    ){

        return surah.name;

    }

    if(
        surah &&
        surah.number
    ){

        return `سوره ${faNumber(surah.number)}`;

    }

    return "سوره";

}


/* =========================================================
   AUDIO URL
========================================================= */

/*
    فایل بسم‌الله مشترک:

    001001.mp3
*/

function getBismillahAudioUrl(){

    return (
        SUPABASE_BASE +
        "001/001001.mp3"
    );

}


/*
    فایل صوتی آیه:

    حمد:
        آیه 1 = 001002
        آیه 2 = 001003
        ...

    سوره‌های 2 تا 8 و 10 تا 114:
        آیه 1 = 002002
        آیه 2 = 002003
        ...

    توبه:
        آیه 1 = 009001
        آیه 2 = 009002
        ...

    بنابراین فقط حمد و توبه با شماره آیه
    یکسان نیستند؛ در حمد هم بسم‌الله
    فایل اول است و در سوره‌های دیگر
    بسم‌الله از فایل مشترک استفاده می‌کند.
*/

function getAudioUrl(
    surahId,
    ayahNumber
){

    const surah =
        String(surahId)
        .padStart(3,"0");


    let fileNumber =
        Number(ayahNumber);


    /*
        حمد:
        فایل اول بسم‌الله است.
    */

    if(
        Number(surahId) === 1
    ){

        fileNumber =
            Number(ayahNumber) + 1;

    }


    /*
        سوره‌های دارای بسم‌الله:
        فایل صوتی بسم‌الله جداست
        و فایل آیه اول از 002 شروع می‌شود.
    */

    else if(
        Number(surahId) !== 9
    ){

        fileNumber =
            Number(ayahNumber) + 1;

    }


    /*
        توبه:
        فایل 009001 مستقیماً آیه اول است.
    */


    const ayah =
        String(fileNumber)
        .padStart(3,"0");


    return (
        SUPABASE_BASE +
        `${surah}/${surah}${ayah}.mp3`
    );

}


/* =========================================================
   LOAD SURAHS
========================================================= */

async function loadSurahs(){

    try{

        surahSelect.innerHTML =
            `
            <option value="">
                در حال دریافت سوره‌ها...
            </option>
            `;

        const response =
            await fetch(
                `${WORKER_URL}/surahs`,
                {
                    method:"GET"
                }
            );

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const result =
            await response.json();

        if(
            !result.ok ||
            !Array.isArray(result.surahs)
        ){

            throw new Error(
                "اطلاعات سوره‌ها از Worker دریافت نشد."
            );

        }

        surahData =
            result.surahs;

        renderSurahList();

        await loadAyahs();

    }
    catch(error){

        console.error(error);

        surahSelect.innerHTML =
            `
            <option>
                خطا در دریافت سوره‌ها
            </option>
            `;

        ayahContainer.innerHTML =
            `
            <div class="error">
                دریافت اطلاعات سوره‌ها با خطا مواجه شد.
                <br>
                ${error.message || ""}
            </div>
            `;

    }

}


/* =========================================================
   RENDER SURAH LIST
========================================================= */

function renderSurahList(){

    surahSelect.innerHTML = "";

    surahData.forEach(
        surah => {

            const option =
                document.createElement("option");

            option.value =
                surah.number;

            option.textContent =
                `${faNumber(surah.number)} - ${getSurahName(surah)}`;

            if(
                Number(surah.number) ===
                Number(currentSurah)
            ){

                option.selected = true;

            }

            surahSelect.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   LOAD AYAHS
========================================================= */

async function loadAyahs(){

    if(isLoading){
        return;
    }

    isLoading = true;

    try{

        ayahContainer.innerHTML =
            `
            <div class="loading">
                در حال دریافت آیات سوره...
            </div>
            `;

        const response =
            await fetch(
                `${WORKER_URL}/ayahs?surah=${encodeURIComponent(currentSurah)}`,
                {
                    method:"GET"
                }
            );

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const result =
            await response.json();

        if(
            !result.ok ||
            !Array.isArray(result.ayahs)
        ){

            throw new Error(
                "آیات از Worker دریافت نشد."
            );

        }

        ayahData =
            result.ayahs;

        currentAyah = 1;

        bismillahPlayedForCurrentAyah = false;

        isBismillahAudio = false;

        renderAyahs();

        updateSurahInfo();

        loadAyah();

    }
    catch(error){

        console.error(error);

        ayahContainer.innerHTML =
            `
            <div class="error">
                دریافت آیات با خطا مواجه شد.
                <br>
                ${error.message || ""}
            </div>
            `;

    }
    finally{

        isLoading = false;

    }

}


/* =========================================================
   EXTRACT BISMILLAH
========================================================= */

function extractBismillah(text){

    if(!text){

        return {
            bismillah:"",
            remaining:""
        };

    }


    const normalized =
        text.normalize("NFC");


    const patterns = [

        "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",

        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",

        "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",

        "بِّسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"

    ];


    for(
        const pattern of patterns
    ){

        const p =
            pattern.normalize("NFC");


        if(
            normalized.startsWith(p)
        ){

            return {

                bismillah:
                    normalized.substring(
                        0,
                        p.length
                    ),

                remaining:
                    normalized
                    .substring(p.length)
                    .trim()

            };

        }

    }


    return {

        bismillah:"",

        remaining:
            normalized

    };

}


/* =========================================================
   RENDER AYAHS
========================================================= */

function renderAyahs(){

    ayahContainer.innerHTML = "";


    ayahData.forEach(
        ayah => {

            const div =
                document.createElement("div");

            div.className =
                "ayah";

            div.id =
                `ayah-${ayah.ayah_number}`;

            div.dataset.ayah =
                ayah.ayah_number;


            let arabicText =
                ayah.text_ar || "";

            let bismillah = "";


            /*
                برای همه سوره‌ها به‌جز:
                سوره حمد
                سوره توبه

                بسم‌الله از نظر نمایشی
                از آیه اول جدا می‌شود.
            */

            if(
                Number(currentSurah) !== 1 &&
                Number(currentSurah) !== 9 &&
                Number(ayah.ayah_number) === 1
            ){

                const extracted =
                    extractBismillah(
                        arabicText
                    );

                bismillah =
                    extracted.bismillah;

                arabicText =
                    extracted.remaining;

            }


            const translation =
                ayah.text_fa &&
                ayah.text_fa.trim()
                    ? ayah.text_fa
                    : "";


            let html = "";


            if(bismillah){

                html +=
                    `
                    <div class="bismillah">
                        ${bismillah}
                    </div>
                    `;

            }


            html +=
                `
                <div class="arabic">

                    <span class="ayah-number">
                        ${faNumber(
                            ayah.ayah_number
                        )}
                    </span>

                    ${arabicText}

                </div>

                <div class="translation">

                    ${
                        translation

                        ? translation

                        :

                        `
                        <span class="translation-empty">
                            ترجمه فارسی در مرحله بعد اضافه می‌شود.
                        </span>
                        `
                    }

                </div>
                `;


            div.innerHTML =
                html;


            div.addEventListener(
                "click",
                () => {

                    currentAyah =
                        Number(
                            ayah.ayah_number
                        );


                    /*
                        اگر کاربر مستقیماً
                        آیه اول را انتخاب کند،
                        بسم‌الله باید دوباره پخش شود.
                    */

                    if(
                        currentAyah === 1 &&
                        Number(currentSurah) !== 1 &&
                        Number(currentSurah) !== 9
                    ){

                        bismillahPlayedForCurrentAyah =
                            false;

                    }
                    else{

                        bismillahPlayedForCurrentAyah =
                            true;

                    }


                    updateSurahInfo();

                    loadAyah();

                    playAudio();

                }
            );


            ayahContainer.appendChild(
                div
            );

        }
    );


    highlightCurrentAyah();

}


/* =========================================================
   SURAH INFO
========================================================= */

function updateSurahInfo(){

    const surah =
        surahData.find(
            item =>
                Number(item.number) ===
                Number(currentSurah)
        );


    if(surah){

        surahName.textContent =
            getSurahName(surah);

    }
    else{

        surahName.textContent =
            `سوره ${faNumber(currentSurah)}`;

    }


    const total =
        ayahData.length ||
        (
            surah
            ? surah.ayah_count
            : 0
        );


    surahInfo.textContent =
        `آیه ${faNumber(currentAyah)} از ${faNumber(total)}`;

}


/* =========================================================
   LOAD AYAH AUDIO
========================================================= */

function loadAyah(){

    if(!ayahData.length){
        return;
    }


    const ayah =
        ayahData.find(
            item =>
                Number(item.ayah_number) ===
                Number(currentAyah)
        );


    if(!ayah){
        return;
    }


    const audioUrl =
        getAudioUrl(
            currentSurah,
            currentAyah
        );


    isBismillahAudio = false;


    audio.src =
        audioUrl;

    audio.load();


    currentTimeElement.textContent =
        "0:00";

    durationElement.textContent =
        "0:00";

    progress.style.width =
        "0%";


    playerStatus.textContent =
        `آیه ${faNumber(currentAyah)}`;


    highlightCurrentAyah();

    updateSurahInfo();

}


/* =========================================================
   PLAY BISMILLAH
========================================================= */

async function playBismillah(){

    try{

        isBismillahAudio = true;


        audio.src =
            getBismillahAudioUrl();

        audio.load();


        currentTimeElement.textContent =
            "0:00";

        durationElement.textContent =
            "0:00";

        progress.style.width =
            "0%";


        playerStatus.textContent =
            "در حال پخش بسم‌الله";


        await audio.play();


        playButton.textContent =
            "⏸";

        playButton.title =
            "توقف";

    }
    catch(error){

        console.error(error);

        isBismillahAudio = false;

        playerStatus.textContent =
            "برای پخش، دوباره دکمه پخش را لمس کنید.";

    }

}


/* =========================================================
   PLAY
========================================================= */

async function playAudio(){

    try{

        /*
            اگر در حال پخش بسم‌الله هستیم،
            فقط ادامه بده.
        */

        if(
            isBismillahAudio
        ){

            await audio.play();

            playButton.textContent =
                "⏸";

            playButton.title =
                "توقف";

            return;

        }


        /*
            برای سوره‌های دارای بسم‌الله،
            قبل از آیه اول یک بار بسم‌الله
            پخش می‌شود.
        */

        if(
            Number(currentAyah) === 1 &&
            Number(currentSurah) !== 1 &&
            Number(currentSurah) !== 9 &&
            !bismillahPlayedForCurrentAyah
        ){

            await playBismillah();

            return;

        }


        if(!audio.src){

            loadAyah();

        }


        await audio.play();


        playButton.textContent =
            "⏸";

        playButton.title =
            "توقف";


        playerStatus.textContent =
            `در حال پخش آیه ${faNumber(currentAyah)}`;

    }
    catch(error){

        console.error(error);

        playerStatus.textContent =
            "برای پخش، دوباره دکمه پخش را لمس کنید.";

    }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseAudio(){

    audio.pause();

    playButton.textContent =
        "▶";

    playButton.title =
        "پخش";


    if(isBismillahAudio){

        playerStatus.textContent =
            "بسم‌الله";

    }
    else{

        playerStatus.textContent =
            `آیه ${faNumber(currentAyah)}`;

    }

}


/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    () => {

        if(audio.paused){

            playAudio();

        }
        else{

            pauseAudio();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(
    "click",
    () => {

        if(!ayahData.length){
            return;
        }


        if(currentAyah > 1){

            currentAyah--;


            /*
                اگر به آیه اول رسیدیم،
                برای سوره‌های دارای بسم‌الله
                باید بسم‌الله دوباره پخش شود.
            */

            if(
                currentAyah === 1 &&
                Number(currentSurah) !== 1 &&
                Number(currentSurah) !== 9
            ){

                bismillahPlayedForCurrentAyah =
                    false;

            }
            else{

                bismillahPlayedForCurrentAyah =
                    true;

            }


            loadAyah();

            playAudio();

        }
        else{

            playerStatus.textContent =
                "این اولین آیه سوره است.";

        }

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if(!ayahData.length){
            return;
        }


        if(
            currentAyah <
            ayahData.length
        ){

            currentAyah++;


            /*
                برای آیات بعد از آیه اول
                دیگر نیازی به بسم‌الله نیست.
            */

            bismillahPlayedForCurrentAyah =
                true;


            loadAyah();

            playAudio();

        }
        else{

            playerStatus.textContent =
                "این آخرین آیه سوره است.";

        }

    }
);


/* =========================================================
   AUTO NEXT
========================================================= */

audio.addEventListener(
    "ended",
    () => {

        /*
            اگر بسم‌الله تمام شد:
            حالا آیه اول همان سوره را پخش کن.
        */

        if(isBismillahAudio){

            isBismillahAudio =
                false;

            bismillahPlayedForCurrentAyah =
                true;


            loadAyah();

            playAudio();

            return;

        }


        /*
            اگر آیه تمام شد،
            برو آیه بعدی.
        */

        playButton.textContent =
            "▶";

        playButton.title =
            "پخش";


        if(
            currentAyah <
            ayahData.length
        ){

            currentAyah++;

            bismillahPlayedForCurrentAyah =
                true;

            loadAyah();

            playAudio();

        }
        else{

            playerStatus.textContent =
                "سوره به پایان رسید.";

        }

    }
);


/* =========================================================
   METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        if(
            Number.isFinite(
                audio.duration
            )
        ){

            durationElement.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =========================================================
   TIME UPDATE
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        const current =
            audio.currentTime || 0;

        const duration =
            audio.duration || 0;


        currentTimeElement.textContent =
            formatTime(current);


        if(duration > 0){

            const percent =
                (
                    current /
                    duration
                ) * 100;


            progress.style.width =
                `${Math.min(
                    100,
                    Math.max(
                        0,
                        percent
                    )
                )}%`;

        }

    }
);


/* =========================================================
   SEEK
========================================================= */

progressWrap.addEventListener(
    "click",
    event => {

        if(
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ){

            return;

        }


        const rect =
            progressWrap.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            position /
            rect.width;


        const safePercent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );


        audio.currentTime =
            safePercent *
            audio.duration;

    }
);


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightCurrentAyah(){

    document
        .querySelectorAll(".ayah")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    const current =
        document.getElementById(
            `ayah-${currentAyah}`
        );


    if(current){

        current.classList.add(
            "active"
        );


        setTimeout(
            () => {

                current.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            },
            50
        );

    }

}


/* =========================================================
   SURAH CHANGE
========================================================= */

surahSelect.addEventListener(
    "change",
    async () => {

        const value =
            Number(
                surahSelect.value
            );


        if(
            !value ||
            value < 1 ||
            value > 114
        ){

            return;

        }


        pauseAudio();

        audio.removeAttribute(
            "src"
        );


        isBismillahAudio =
            false;

        bismillahPlayedForCurrentAyah =
            false;


        progress.style.width =
            "0%";

        currentTimeElement.textContent =
            "0:00";

        durationElement.textContent =
            "0:00";


        currentSurah =
            value;

        currentAyah =
            1;


        await loadAyahs();

    }
);


/* =========================================================
   MODES
========================================================= */

const modeButtons =
    document.querySelectorAll(
        ".mode"
    );


modeButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                modeButtons.forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                currentMode =
                    button.dataset.mode;


                if(
                    currentMode ===
                    "arabic"
                ){

                    playerStatus.textContent =
                        "🔊 فقط قرائت";

                }
                else if(
                    currentMode ===
                    "translation"
                ){

                    playerStatus.textContent =
                        "🇮🇷 فقط ترجمه";

                }
                else{

                    playerStatus.textContent =
                        "🔊🇮🇷 قرائت + ترجمه";

                }

            }
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            if(audio.paused){

                playAudio();

            }
            else{

                pauseAudio();

            }

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            prevButton.click();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            nextButton.click();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadSurahs();

</script>

</body>
</html>
