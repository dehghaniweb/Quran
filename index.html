<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>قرآن کریم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7f4;
    color:#173c2c;
}


/* ================================
   HEADER
================================ */

header{
    background:#0b4b35;
    color:white;
    padding:20px 16px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

header h1{
    margin:0 0 8px;
    font-size:22px;
}

header p{
    margin:0;
    opacity:.85;
    font-size:13px;
}


/* ================================
   CONTAINER
================================ */

.container{
    width:min(850px,calc(100% - 24px));
    margin:18px auto 40px;
}


/* ================================
   SURAH LIST
================================ */

.surah-list{
    display:grid;
    gap:12px;
}

.surah-card{
    background:white;
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.surah-card:active{
    transform:scale(.98);
}

.surah-number{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#0b4b35;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.surah-info{
    flex:1;
}

.surah-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.surah-meta{
    font-size:12px;
    color:#718278;
}

.surah-arrow{
    font-size:22px;
    color:#27845a;
}


/* ================================
   BACK BUTTON
================================ */

.back-button{
    border:0;
    background:#e9f2ed;
    color:#0b4b35;
    border-radius:12px;
    padding:10px 15px;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:14px;
    font-size:13px;
}


/* ================================
   PLAYER
================================ */

.player{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.mode-title{
    font-weight:bold;
    margin-bottom:12px;
}

.modes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.mode{
    border:1px solid #d6e3dc;
    background:#f7faf8;
    color:#24533f;
    border-radius:12px;
    padding:11px 5px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
}

.mode.active{
    background:#0b4b35;
    color:white;
    border-color:#0b4b35;
}


/* ================================
   CONTROLS
================================ */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.control{
    border:0;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#e9f2ed;
    color:#0b4b35;
    font-size:20px;
    cursor:pointer;
}

.play{
    width:62px;
    height:62px;
    background:#0b4b35;
    color:white;
    font-size:25px;
}


/* ================================
   PROGRESS
================================ */

.progress{
    width:100%;
    height:7px;
    border-radius:10px;
    overflow:hidden;
    background:#e1e9e4;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#27845a;
    transition:width .1s linear;
}


/* ================================
   TIME
================================ */

.time{
    display:flex;
    justify-content:space-between;
    direction:rtl;
    font-size:11px;
    color:#718278;
    margin-top:7px;
}


/* ================================
   AYAH
================================ */

.ayah{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    margin-bottom:14px;
    border:2px solid transparent;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.25s;
}

.ayah.active{
    border-color:#27845a;
    background:#eef8f2;
    box-shadow:0 5px 22px rgba(39,132,90,.18);
}

.ayah-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#0b4b35;
    color:white;
    font-size:13px;
    margin-left:8px;
}

.arabic{
    font-family:"Amiri","Traditional Arabic",serif;
    font-size:29px;
    line-height:2.2;
    text-align:right;
}

.translation{
    margin-top:15px;
    padding-top:13px;
    border-top:1px solid #dfe8e2;
    color:#65766d;
    font-size:14px;
    line-height:2;
}


/* ================================
   STATUS
================================ */

.status{
    text-align:center;
    font-size:12px;
    color:#718278;
    margin-top:12px;
}


/* ================================
   HIDDEN
================================ */

.hidden{
    display:none;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .modes{
        grid-template-columns:1fr;
    }

    .arabic{
        font-size:25px;
    }

}

</style>

</head>


<body>


<header>

    <h1 id="pageTitle">
        📖 قرآن کریم
    </h1>

    <p id="pageSubtitle">
        فهرست سوره‌ها
    </p>

</header>


<div class="container">


    <!-- =================================
         صفحه فهرست سوره‌ها
    ================================= -->

    <section id="surahPage">

        <div class="surah-list">


            <div
                class="surah-card"
                data-surah="1"
            >

                <div class="surah-number">
                    ۱
                </div>

                <div class="surah-info">

                    <div class="surah-name">
                        سوره حمد
                    </div>

                    <div class="surah-meta">
                        ۷ آیه
                    </div>

                </div>

                <div class="surah-arrow">
                    ‹
                </div>

            </div>


            <div
                class="surah-card"
                data-surah="2"
            >

                <div class="surah-number">
                    ۲
                </div>

                <div class="surah-info">

                    <div class="surah-name">
                        سوره بقره
                    </div>

                    <div class="surah-meta">
                        ۲۸۶ آیه
                    </div>

                </div>

                <div class="surah-arrow">
                    ‹
                </div>

            </div>


        </div>

    </section>



    <!-- =================================
         صفحه سوره
    ================================= -->

    <section
        id="quranPage"
        class="hidden"
    >


        <button
            class="back-button"
            id="backButton"
        >
            → بازگشت به فهرست سوره‌ها
        </button>


        <!-- PLAYER -->

        <div class="player">


            <div class="mode-title">
                حالت پخش
            </div>


            <div class="modes">


                <button
                    class="mode active"
                    data-mode="arabic"
                >
                    🔊 فقط قرائت
                </button>


                <button
                    class="mode"
                    data-mode="persian"
                >
                    🇮🇷 فقط ترجمه
                </button>


                <button
                    class="mode"
                    data-mode="both"
                >
                    🔊🇮🇷 قرائت + ترجمه
                </button>


            </div>


            <div class="controls">


                <button
                    class="control"
                    id="prev"
                >
                    ⏮
                </button>


                <button
                    class="control play"
                    id="play"
                >
                    ▶
                </button>


                <button
                    class="control"
                    id="next"
                >
                    ⏭
                </button>


            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <div
                class="status"
                id="status"
            >
                آماده پخش
            </div>


        </div>


        <!-- آیات -->

        <div id="ayahContainer"></div>


    </section>


</div>



<script>

/* =========================================
   تنظیمات Supabase
========================================= */

const SUPABASE_BASE =
"https://wiulmslaensqnwlcjxtp.supabase.co/storage/v1/object/public/quran-audio/arabic/";


/* =========================================
   اطلاعات فعلی سوره
========================================= */

let currentSurah = 1;

let currentAyah = 1;

let currentMode = "arabic";

let isPlaying = false;


/* =========================================
   اطلاعات موقت سوره‌ها
========================================= */

const surahs = {

    1:{
        name:"سوره حمد",
        count:7
    },

    2:{
        name:"سوره بقره",
        count:286
    }

};


/* =========================================
   متن فعلی حمد
========================================= */

const fatihahAyahs = [

    {
        number:1,
        arabic:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
        translation:"به نام خداوند بخشنده مهربان"
    },

    {
        number:2,
        arabic:"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
        translation:"ستایش مخصوص خداوند، پروردگار جهانیان است."
    },

    {
        number:3,
        arabic:"الرَّحْمَٰنِ الرَّحِيمِ",
        translation:"بخشنده مهربان است."
    },

    {
        number:4,
        arabic:"مَالِكِ يَوْمِ الدِّينِ",
        translation:"مالک روز جزاست."
    },

    {
        number:5,
        arabic:"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
        translation:"تنها تو را می‌پرستیم و تنها از تو یاری می‌جوییم."
    },

    {
        number:6,
        arabic:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
        translation:"ما را به راه راست هدایت کن."
    },

    {
        number:7,
        arabic:"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",
        translation:"راه کسانی که به آنان نعمت داده‌ای؛ نه راه کسانی که مورد خشم قرار گرفته‌اند و نه راه گمراهان."
    }

];


/* =========================================
   Audio
========================================= */

const audio =
new Audio();

audio.preload =
"metadata";


/* =========================================
   عناصر
========================================= */

const surahPage =
document.getElementById("surahPage");

const quranPage =
document.getElementById("quranPage");

const pageTitle =
document.getElementById("pageTitle");

const pageSubtitle =
document.getElementById("pageSubtitle");

const ayahContainer =
document.getElementById("ayahContainer");

const backButton =
document.getElementById("backButton");

const playButton =
document.getElementById("play");

const prevButton =
document.getElementById("prev");

const nextButton =
document.getElementById("next");

const progressBar =
document.getElementById("progressBar");

const currentTimeElement =
document.getElementById("currentTime");

const durationElement =
document.getElementById("duration");

const statusElement =
document.getElementById("status");


/* =========================================
   ساخت URL صوت
========================================= */

function getAudioUrl(
    surahId,
    ayahNumber
){

    const surah =
        String(surahId)
        .padStart(3,"0");

    const ayah =
        String(ayahNumber)
        .padStart(3,"0");

    return (
        SUPABASE_BASE +
        `${surah}/${surah}${ayah}.mp3`
    );

}


/* =========================================
   زمان
========================================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${minutes}:${secs}`;

}


/* =========================================
   نمایش آیات
========================================= */

function renderAyahs(){

    ayahContainer.innerHTML = "";


    /*
     * فعلاً فقط متن کامل حمد داریم.
     */

    if(currentSurah === 1){

        fatihahAyahs.forEach(ayah=>{

            const div =
                document.createElement("div");

            div.className =
                "ayah";

            div.dataset.ayah =
                ayah.number;

            div.id =
                `ayah-${ayah.number}`;


            div.innerHTML = `

                <div class="arabic">

                    <span class="ayah-number">
                        ${ayah.number}
                    </span>

                    ${ayah.arabic}

                </div>

                <div class="translation">

                    ${ayah.translation}

                </div>

            `;


            div.addEventListener(
                "click",
                ()=>{

                    currentAyah =
                        ayah.number;

                    loadAyah();

                    playAudio();

                }
            );


            ayahContainer.appendChild(div);

        });


        return;

    }


    /*
     * بقره
     *
     * فعلاً تا زمانی که متن کامل آیات
     * وارد دیتابیس نشده است،
     * فقط یک پیام نشان می‌دهیم.
     */

    if(currentSurah === 2){

        ayahContainer.innerHTML = `

            <div class="ayah">

                <div class="arabic">

                    <span class="ayah-number">
                        ۲
                    </span>

                    سوره بقره

                </div>

                <div class="translation">

                    فایل‌های صوتی این سوره در
                    Supabase قرار گرفته‌اند.
                    متن کامل آیات در مرحله بعد
                    به دیتابیس اضافه می‌شود.

                </div>

            </div>

        `;

    }

}


/* =========================================
   فعال کردن آیه
========================================= */

function activateAyah(){

    document
        .querySelectorAll(".ayah")
        .forEach(el=>{

            el.classList.remove(
                "active"
            );

        });


    const ayah =
        document.getElementById(
            `ayah-${currentAyah}`
        );


    if(!ayah){
        return;
    }


    ayah.classList.add(
        "active"
    );


    ayah.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

}


/* =========================================
   بارگذاری آیه
========================================= */

function loadAyah(){

    audio.src =
        getAudioUrl(
            currentSurah,
            currentAyah
        );


    audio.load();


    activateAyah();


    progressBar.style.width =
        "0%";


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    statusElement.textContent =
        `آیه ${currentAyah} آماده پخش است.`;

}


/* =========================================
   پخش
========================================= */

async function playAudio(){

    try{

        await audio.play();


        isPlaying =
            true;


        playButton.textContent =
            "⏸";


        statusElement.textContent =
            `در حال پخش آیه ${currentAyah}`;


        activateAyah();

    }

    catch(error){

        console.error(error);

        statusElement.textContent =
            "پخش فایل صوتی انجام نشد.";

    }

}


/* =========================================
   توقف
========================================= */

function pauseAudio(){

    audio.pause();

    isPlaying =
        false;

    playButton.textContent =
        "▶";

    statusElement.textContent =
        `پخش آیه ${currentAyah} متوقف شد.`;

}


/* =========================================
   انتخاب سوره
========================================= */

document
    .querySelectorAll(".surah-card")
    .forEach(card=>{

        card.addEventListener(
            "click",
            ()=>{

                currentSurah =
                    Number(
                        card.dataset.surah
                    );

                currentAyah =
                    1;

                isPlaying =
                    false;

                audio.pause();

                playButton.textContent =
                    "▶";


                surahPage.classList.add(
                    "hidden"
                );

                quranPage.classList.remove(
                    "hidden"
                );


                pageTitle.textContent =
                    "📖 قرآن کریم";


                pageSubtitle.textContent =
                    surahs[currentSurah].name;


                renderAyahs();


                loadAyah();

            }
        );

    });


/* =========================================
   بازگشت
========================================= */

backButton.addEventListener(
    "click",
    ()=>{

        audio.pause();

        isPlaying =
            false;

        surahPage.classList.remove(
            "hidden"
        );

        quranPage.classList.add(
            "hidden"
        );

        pageTitle.textContent =
            "📖 قرآن کریم";

        pageSubtitle.textContent =
            "فهرست سوره‌ها";

    }
);


/* =========================================
   Play / Pause
========================================= */

playButton.addEventListener(
    "click",
    ()=>{

        if(isPlaying){

            pauseAudio();

        }
        else{

            playAudio();

        }

    }
);


/* =========================================
   قبلی
========================================= */

prevButton.addEventListener(
    "click",
    ()=>{

        if(currentAyah > 1){

            currentAyah--;

            loadAyah();

            playAudio();

        }
        else{

            statusElement.textContent =
                "این اولین آیه سوره است.";

        }

    }
);


/* =========================================
   بعدی
========================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        if(
            currentAyah <
            surahs[currentSurah].count
        ){

            currentAyah++;

            loadAyah();

            playAudio();

        }
        else{

            statusElement.textContent =
                "این آخرین آیه سوره است.";

        }

    }
);


/* =========================================
   حالت پخش
========================================= */

document
    .querySelectorAll(".mode")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                document
                    .querySelectorAll(".mode")
                    .forEach(btn=>{

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                currentMode =
                    button.dataset.mode;


                statusElement.textContent =
                    "حالت پخش انتخاب شد: " +
                    button.textContent.trim();

            }
        );

    });


/* =========================================
   Metadata
========================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        durationElement.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================
   پیشرفت
========================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration){
            return;
        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percent + "%";


        currentTimeElement.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================
   پایان آیه
========================================= */

audio.addEventListener(
    "ended",
    ()=>{

        isPlaying =
            false;

        playButton.textContent =
            "▶";

        progressBar.style.width =
            "100%";


        if(
            currentAyah <
            surahs[currentSurah].count
        ){

            currentAyah++;

            /*
             * اگر آیه در صفحه وجود دارد
             * فعال شود.
             */

            loadAyah();

            playAudio();

        }

        else{

            statusElement.textContent =
                `${surahs[currentSurah].name} به پایان رسید.`;

        }

    }
);

</script>

</body>

</html>
