<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>قرآن کریم</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f7f4;
    color:#173c2c;
}

header{
    background:#0b4b35;
    color:white;
    padding:20px 16px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

header h1{
    margin:0 0 8px;
    font-size:22px;
}

header p{
    margin:0;
    opacity:.9;
    font-size:13px;
}

.container{
    width:min(850px,calc(100% - 24px));
    margin:18px auto 40px;
}

.hidden{
    display:none !important;
}


/* ================================
   SURAH LIST
================================ */

.surah-list{
    display:grid;
    gap:12px;
}

.surah-card{
    background:white;
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.surah-card:active{
    transform:scale(.98);
}

.surah-number{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#0b4b35;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.surah-info{
    flex:1;
}

.surah-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.surah-meta{
    font-size:12px;
    color:#718278;
}

.surah-arrow{
    font-size:22px;
    color:#27845a;
}


/* ================================
   BACK
================================ */

.back-button{
    border:0;
    background:#e9f2ed;
    color:#0b4b35;
    border-radius:12px;
    padding:10px 15px;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:14px;
    font-size:13px;
}


/* ================================
   PLAYER
================================ */

.player{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.surah-current-info{
    text-align:center;
    background:#eef8f2;
    border-radius:14px;
    padding:12px;
    margin-bottom:15px;
}

.surah-current-name{
    font-size:18px;
    font-weight:bold;
    color:#0b4b35;
    margin-bottom:6px;
}

.surah-current-ayah{
    font-size:12px;
    color:#718278;
    font-weight:bold;
}


/* ================================
   MODES
================================ */

.mode-title{
    font-weight:bold;
    margin-bottom:12px;
}

.modes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.mode{
    border:1px solid #d6e3dc;
    background:#f7faf8;
    color:#24533f;
    border-radius:12px;
    padding:11px 5px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
}

.mode.active{
    background:#0b4b35;
    color:white;
    border-color:#0b4b35;
}


/* ================================
   CONTROLS
================================ */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.control{
    border:0;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#e9f2ed;
    color:#0b4b35;
    font-size:20px;
    cursor:pointer;
}

.play{
    width:62px;
    height:62px;
    background:#0b4b35;
    color:white;
    font-size:25px;
}


/* ================================
   PROGRESS
================================ */

.progress{
    width:100%;
    height:7px;
    border-radius:10px;
    overflow:hidden;
    background:#e1e9e4;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#27845a;
    transition:width .1s linear;
}


/* ================================
   TIME
================================ */

.time{
    display:flex;
    justify-content:space-between;
    direction:rtl;
    font-size:11px;
    color:#718278;
    margin-top:7px;
}


/* ================================
   AYAH
================================ */

.ayah{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    margin-bottom:14px;
    border:2px solid transparent;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.25s;
}

.ayah.active{
    border-color:#27845a;
    background:#eef8f2;
    box-shadow:0 5px 22px rgba(39,132,90,.18);
}

.ayah-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#0b4b35;
    color:white;
    font-size:13px;
    margin-left:8px;
    font-family:Tahoma,Arial,sans-serif;
    vertical-align:middle;
}

.arabic{
    font-family:"Amiri","Traditional Arabic",serif;
    font-size:29px;
    line-height:2.2;
    text-align:right;
    font-weight:700 !important;
}

.translation{
    margin-top:15px;
    padding-top:13px;
    border-top:1px solid #dfe8e2;
    color:#65766d;
    font-size:14px;
    line-height:2;
    font-weight:700 !important;
}

.translation-empty{
    color:#8a9991;
    font-size:12px;
    font-weight:bold;
}


/* ================================
   STATUS
================================ */

.status{
    text-align:center;
    font-size:12px;
    color:#718278;
    margin-top:12px;
}


/* ================================
   LOADING
================================ */

.loading{
    text-align:center;
    background:white;
    border-radius:18px;
    padding:25px;
    color:#718278;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .modes{
        grid-template-columns:1fr;
    }

    .arabic{
        font-size:25px;
    }

}

</style>

</head>


<body>


<header>

<h1 id="pageTitle">
    📖 قرآن کریم
</h1>

<p id="pageSubtitle">
    فهرست سوره‌ها
</p>

</header>


<div class="container">


<!-- ============================
     فهرست سوره‌ها
============================= -->

<section id="surahPage">

    <div
        id="surahList"
        class="surah-list"
    >

        <div class="loading">
            در حال دریافت فهرست سوره‌ها...
        </div>

    </div>

</section>


<!-- ============================
     صفحه سوره
============================= -->

<section
    id="quranPage"
    class="hidden"
>


    <button
        class="back-button"
        id="backButton"
    >
        → بازگشت به فهرست سوره‌ها
    </button>


    <div class="player">


        <div class="surah-current-info">

            <div
                class="surah-current-name"
                id="currentSurahName"
            >
                سوره
            </div>

            <div
                class="surah-current-ayah"
                id="currentAyahInfo"
            >
                آیه ۱
            </div>

        </div>


        <div class="mode-title">
            حالت پخش
        </div>


        <div class="modes">

            <button
                class="mode active"
                data-mode="arabic"
            >
                🔊 فقط قرائت
            </button>

            <button
                class="mode"
                data-mode="persian"
            >
                🇮🇷 فقط ترجمه
            </button>

            <button
                class="mode"
                data-mode="both"
            >
                🔊🇮🇷 قرائت + ترجمه
            </button>

        </div>


        <div class="controls">


            <!-- آیه بعد -->

            <button
                class="control"
                id="next"
                title="آیه بعد"
            >
                ⏭
            </button>


            <!-- پخش -->

            <button
                class="control play"
                id="play"
                title="پخش"
            >
                ▶
            </button>


            <!-- آیه قبل -->

            <button
                class="control"
                id="prev"
                title="آیه قبل"
            >
                ⏮
            </button>


        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>


        <div
            class="status"
            id="status"
        >
            آماده پخش
        </div>


    </div>


    <div id="ayahContainer"></div>


</section>


</div>


<script>


/* =========================================
   تنظیمات
========================================= */


/*
   آدرس Cloudflare Worker

   هیچ کلید Supabase در این فایل وجود ندارد.
*/

const WORKER_URL =
"https://quran-importer.dehghaniweb.workers.dev";


/*
   آدرس عمومی فایل‌های صوتی

   این Bucket عمومی است و برای پخش MP3
   نیازی به API Key ندارد.
*/

const SUPABASE_URL =
"https://wiulmslaensqnwlcjxtp.supabase.co";


const SUPABASE_BASE =
SUPABASE_URL +
"/storage/v1/object/public/quran-audio/arabic/";


/* =========================================
   وضعیت برنامه
========================================= */

let currentSurah = 1;

let currentAyah = 1;

let currentMode = "arabic";

let isPlaying = false;

let surahData = [];

let ayahData = [];


/* =========================================
   عناصر
========================================= */

const surahPage =
document.getElementById("surahPage");

const quranPage =
document.getElementById("quranPage");

const surahList =
document.getElementById("surahList");

const pageTitle =
document.getElementById("pageTitle");

const pageSubtitle =
document.getElementById("pageSubtitle");

const ayahContainer =
document.getElementById("ayahContainer");

const backButton =
document.getElementById("backButton");

const playButton =
document.getElementById("play");

const prevButton =
document.getElementById("prev");

const nextButton =
document.getElementById("next");

const progressBar =
document.getElementById("progressBar");

const currentTimeElement =
document.getElementById("currentTime");

const durationElement =
document.getElementById("duration");

const statusElement =
document.getElementById("status");

const currentSurahName =
document.getElementById("currentSurahName");

const currentAyahInfo =
document.getElementById("currentAyahInfo");


/* =========================================
   Audio
========================================= */

const audio =
new Audio();

audio.preload =
"metadata";


/* =========================================
   تبدیل اعداد به فارسی
========================================= */

function faNumber(value){

    return String(value)
        .replace(/\d/g, d =>
            "۰۱۲۳۴۵۶۷۸۹"[d]
        );

}


/* =========================================
   نام سوره
========================================= */

function getSurahName(surah){

    /*
       نام فارسی را ترجیح می‌دهیم.
       اگر موجود نبود نام عربی استفاده می‌شود.
    */

    if(
        surah &&
        surah.name_fa
    ){
        return surah.name_fa;
    }


    if(
        surah &&
        surah.name_ar
    ){
        return surah.name_ar;
    }


    if(
        surah &&
        surah.name
    ){
        return surah.name;
    }


    if(
        surah &&
        surah.number
    ){
        return `سوره ${faNumber(surah.number)}`;
    }


    return "سوره";

}


/* =========================================
   URL صوت
========================================= */

function getAudioUrl(
    surahId,
    ayahNumber
){

    const surah =
        String(surahId)
        .padStart(3,"0");


    const ayah =
        String(ayahNumber)
        .padStart(3,"0");


    return (
        SUPABASE_BASE +
        `${surah}/${surah}${ayah}.mp3`
    );

}


/* =========================================
   زمان
========================================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");


    return `${minutes}:${secs}`;

}


/* =========================================
   دریافت سوره‌ها از Worker
========================================= */

async function loadSurahs(){

    try{

        statusElement.textContent =
            "در حال دریافت فهرست سوره‌ها...";


        const response =
            await fetch(
                `${WORKER_URL}/surahs`,
                {
                    method:"GET"
                }
            );


        if(!response.ok){

            throw new Error(
                `خطای Worker: ${response.status}`
            );

        }


        const result =
            await response.json();


        if(
            !result.ok ||
            !Array.isArray(result.surahs)
        ){

            throw new Error(
                "اطلاعات سوره‌ها از Worker دریافت نشد."
            );

        }


        surahData =
            result.surahs;


        renderSurahList();


    }
    catch(error){

        console.error(
            "loadSurahs:",
            error
        );


        surahList.innerHTML = `

            <div class="loading">

                دریافت فهرست سوره‌ها انجام نشد.

                <br><br>

                لطفاً اتصال اینترنت را بررسی کنید.

                <br><br>

                <small>
                    ${error.message || ""}
                </small>

            </div>

        `;

    }

}


/* =========================================
   نمایش فهرست سوره‌ها
========================================= */

function renderSurahList(){

    surahList.innerHTML = "";


    surahData.forEach(surah=>{

        const card =
            document.createElement("div");


        card.className =
            "surah-card";


        card.dataset.surah =
            surah.id;


        const count =
            surah.ayah_count ??
            surah.verses_count ??
            "";


        card.innerHTML = `

            <div class="surah-number">

                ${faNumber(surah.number)}

            </div>


            <div class="surah-info">

                <div class="surah-name">

                    ${getSurahName(surah)}

                </div>


                <div class="surah-meta">

                    ${
                        count
                        ?
                        faNumber(count) + " آیه"
                        :
                        "مشاهده آیات"
                    }

                </div>

            </div>


            <div class="surah-arrow">
                ‹
            </div>

        `;


        card.addEventListener(
            "click",
            ()=>openSurah(surah)
        );


        surahList.appendChild(card);

    });

}


/* =========================================
   باز کردن سوره
========================================= */

async function openSurah(surah){

    currentSurah =
        Number(surah.number || surah.id);


    currentAyah =
        1;


    isPlaying =
        false;


    audio.pause();


    audio.currentTime =
        0;


    playButton.textContent =
        "▶";


    surahPage.classList.add(
        "hidden"
    );


    quranPage.classList.remove(
        "hidden"
    );


    pageTitle.textContent =
        "📖 قرآن کریم";


    pageSubtitle.textContent =
        getSurahName(surah);


    currentSurahName.textContent =
        getSurahName(surah);


    currentAyahInfo.textContent =
        "در حال دریافت آیات...";


    ayahContainer.innerHTML = `

        <div class="loading">
            در حال دریافت آیات...
        </div>

    `;


    await loadAyahs();

}


/* =========================================
   دریافت آیات از Worker
========================================= */

async function loadAyahs(){

    try{

        const response =
            await fetch(
                `${WORKER_URL}/ayahs?surah=${encodeURIComponent(currentSurah)}`,
                {
                    method:"GET"
                }
            );


        if(!response.ok){

            throw new Error(
                `خطای Worker: ${response.status}`
            );

        }


        const result =
            await response.json();


        if(
            !result.ok ||
            !Array.isArray(result.ayahs)
        ){

            throw new Error(
                "آیات از Worker دریافت نشد."
            );

        }


        ayahData =
            result.ayahs;


        if(!ayahData.length){

            throw new Error(
                "هیچ آیه‌ای برای این سوره پیدا نشد."
            );

        }


        currentAyah =
            1;


        renderAyahs();


        updateSurahInfo();


        loadAyah();


    }
    catch(error){

        console.error(
            "loadAyahs:",
            error
        );


        ayahContainer.innerHTML = `

            <div class="loading">

                دریافت آیات انجام نشد.

                <br><br>

                ${error.message || ""}

            </div>

        `;

    }

}


/* =========================================
   نمایش آیات
========================================= */

function renderAyahs(){

    ayahContainer.innerHTML = "";


    ayahData.forEach(ayah=>{

        const div =
            document.createElement("div");


        div.className =
            "ayah";


        div.id =
            `ayah-${ayah.ayah_number}`;


        div.dataset.ayah =
            ayah.ayah_number;


        const translation =
            ayah.text_fa &&
            ayah.text_fa.trim()
                ? ayah.text_fa
                : "";


        div.innerHTML = `

            <div class="arabic">

                <span class="ayah-number">

                    ${faNumber(ayah.ayah_number)}

                </span>

                ${ayah.text_ar || ""}

            </div>


            <div class="translation">

                ${
                    translation
                    ?
                    translation
                    :
                    `<span class="translation-empty">
                        ترجمه فارسی در مرحله بعد اضافه می‌شود.
                    </span>`
                }

            </div>

        `;


        div.addEventListener(
            "click",
            ()=>{

                currentAyah =
                    Number(
                        ayah.ayah_number
                    );


                updateSurahInfo();


                loadAyah();


                playAudio();

            }
        );


        ayahContainer.appendChild(div);

    });

}


/* =========================================
   اطلاعات سوره و آیه
========================================= */

function updateSurahInfo(){

    const surah =
        surahData.find(
            item =>
                Number(item.number || item.id) ===
                Number(currentSurah)
        );


    if(surah){

        currentSurahName.textContent =
            getSurahName(surah);

    }


    currentAyahInfo.textContent =
        `آیه ${faNumber(currentAyah)} از ${faNumber(ayahData.length)}`;

}


/* =========================================
   فعال کردن آیه
========================================= */

function activateAyah(){

    document
        .querySelectorAll(".ayah")
        .forEach(el=>{

            el.classList.remove(
                "active"
            );

        });


    const ayah =
        document.getElementById(
            `ayah-${currentAyah}`
        );


    if(!ayah){
        return;
    }


    ayah.classList.add(
        "active"
    );


    ayah.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

}


/* =========================================
   بارگذاری صوت آیه
========================================= */

function loadAyah(){

    audio.src =
        getAudioUrl(
            currentSurah,
            currentAyah
        );


    audio.load();


    updateSurahInfo();


    activateAyah();


    progressBar.style.width =
        "0%";


    currentTimeElement.textContent =
        "0:00";


    durationElement.textContent =
        "0:00";


    statusElement.textContent =
        `آیه ${faNumber(currentAyah)} آماده پخش است.`;

}


/* =========================================
   پخش
========================================= */

async function playAudio(){

    try{

        await audio.play();


        isPlaying =
            true;


        playButton.textContent =
            "⏸";


        statusElement.textContent =
            `در حال پخش آیه ${faNumber(currentAyah)}`;


        activateAyah();

    }
    catch(error){

        console.error(
            "playAudio:",
            error
        );


        isPlaying =
            false;


        playButton.textContent =
            "▶";


        statusElement.textContent =
            "پخش فایل صوتی انجام نشد.";

    }

}


/* =========================================
   توقف
========================================= */

function pauseAudio(){

    audio.pause();


    isPlaying =
        false;


    playButton.textContent =
        "▶";


    statusElement.textContent =
        `پخش آیه ${faNumber(currentAyah)} متوقف شد.`;

}


/* =========================================
   بازگشت
========================================= */

backButton.addEventListener(
    "click",
    ()=>{

        audio.pause();


        isPlaying =
            false;


        playButton.textContent =
            "▶";


        quranPage.classList.add(
            "hidden"
        );


        surahPage.classList.remove(
            "hidden"
        );


        pageTitle.textContent =
            "📖 قرآن کریم";


        pageSubtitle.textContent =
            "فهرست سوره‌ها";

    }
);


/* =========================================
   Play / Pause
========================================= */

playButton.addEventListener(
    "click",
    ()=>{

        if(isPlaying){

            pauseAudio();

        }
        else{

            playAudio();

        }

    }
);


/* =========================================
   آیه قبل
========================================= */

prevButton.addEventListener(
    "click",
    ()=>{

        if(currentAyah > 1){

            currentAyah--;


            loadAyah();


            playAudio();

        }
        else{

            statusElement.textContent =
                "این اولین آیه سوره است.";

        }

    }
);


/* =========================================
   آیه بعد
========================================= */

nextButton.addEventListener(
    "click",
    ()=>{

        if(
            currentAyah <
            ayahData.length
        ){

            currentAyah++;


            loadAyah();


            playAudio();

        }
        else{

            statusElement.textContent =
                "این آخرین آیه سوره است.";

        }

    }
);


/* =========================================
   حالت پخش
========================================= */

document
    .querySelectorAll(".mode")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                document
                    .querySelectorAll(".mode")
                    .forEach(btn=>{

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                currentMode =
                    button.dataset.mode;


                statusElement.textContent =
                    "حالت پخش انتخاب شد: " +
                    button.textContent.trim();

            }
        );

    });


/* =========================================
   Metadata
========================================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        durationElement.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================
   پیشرفت
========================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration){
            return;
        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.style.width =
            percent + "%";


        currentTimeElement.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================
   پایان آیه
========================================= */

audio.addEventListener(
    "ended",
    ()=>{

        isPlaying =
            false;


        playButton.textContent =
            "▶";


        progressBar.style.width =
            "100%";


        if(
            currentAyah <
            ayahData.length
        ){

            currentAyah++;


            loadAyah();


            playAudio();

        }
        else{

            const surah =
                surahData.find(
                    item =>
                        Number(item.number || item.id) ===
                        Number(currentSurah)
                );


            statusElement.textContent =
                `${getSurahName(surah || {})} به پایان رسید.`;

        }

    }
);


/* =========================================
   شروع برنامه
========================================= */

loadSurahs();

</script>

</body>
</html>
